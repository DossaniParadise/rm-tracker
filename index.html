/* Assignee options, with the auto-matched person pre-selected. */
function impAssignOpts(r){
  const sel=(r.assignKind==="tech"?"tech:":r.assignKind==="vendor"?"vendor:":"")+(r.assignId||"");
  const techs=Object.entries(MASTER.repairTechnicians||{}).sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||""));
  const vends=Object.entries(VENDORS).sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||""));
  return `<option value=""${sel?"":" selected"}>— Unassigned —</option>`
    +(techs.length?`<optgroup label="In-house techs">`+techs.map(([id,t])=>
       `<option value="tech:${id}"${sel==="tech:"+id?" selected":""}>🔧 ${esc(t.name)}</option>`).join("")+`</optgroup>`:"")
    +(vends.length?`<optgroup label="Third-party vendors">`+vends.map(([id,v])=>
       `<option value="vendor:${id}"${sel==="vendor:"+id?" selected":""}>🏢 ${esc(v.name)}</option>`).join("")+`</optgroup>`:"");
}
function impStepStoreChanged(){
  const r=IMP.rows[IMP_Q[IMP_I]];
  r.sid=$("isStore").value;
  renderImportStep();          // category tree can differ by division
}
function impStepCatChanged(){
  const r=IMP.rows[IMP_Q[IMP_I]];
  const tree=catsForStore($("isStore").value);
  const c=tree.find(x=>x.key===$("isCat").value);
  const subs=(c&&c.subs)||[];
  const wrap=$("isSubWrap"), sel=$("isSub");
  if(!subs.length){wrap.style.display="none";sel.innerHTML="";return}
  wrap.style.display="";
  sel.innerHTML=`<option value="">— none —</option>`+subs.map(x=>`<option value="${x.key}">${esc(x.label)}</option>`).join("");
}
function impStepSkip(){IMP_I++;renderImportStep()}
async function impStepSave(){
  const idx=IMP_Q[IMP_I], r=IMP.rows[idx];
  const btn=$("isSave"); if(btn){btn.disabled=true;btn.innerHTML='<span class="inline-spin"></span> Saving…'}
  // take whatever is on screen now
  r.sid=$("isStore").value;
  const cat=$("isCat").value;
  const sub=($("isSubWrap").style.display==="none")?"":($("isSub").value||"");
  r.pri=$("isPri").value;
  r.desc=$("isDesc").value.trim();
  r.createdByName=$("isBy").value.trim();
  if($("isNote"))r.lastNote=$("isNote").value.trim();
  const d=Date.parse($("isDate").value+"T12:00:00");
  if(!isNaN(d))r.createdAt=d;

  // Assignment: a matched person means the ticket arrives dispatched, not in
  // the unassigned pool — mirroring how assignment works everywhere else.
  const whoVal=$("isWho")?$("isWho").value:"";
  let aTech=null,aVend=null;
  if(whoVal.startsWith("tech:"))aTech=whoVal.slice(5);
  else if(whoVal.startsWith("vendor:"))aVend=whoVal.slice(7);
  // remember the override so returning to this row keeps the choice
  r.assignKind=aTech?"tech":(aVend?"vendor":"");
  r.assignId=aTech||aVend||"";
  const id=uid();
  const shortId=nextShortId(r.sid,cat);
  const activity=[{ts:r.createdAt,by:r.createdByName||"OwlOps",role:"manager",action:"created",note:"Imported from OwlOps #"+r.ref}];
  const comments=[];
  if(r.lastNote)comments.push({id:uid(),by:r.lastBy||"OwlOps",role:"manager",email:"",text:r.lastNote,ts:r.updatedAt||r.createdAt});
  if(r.closeNotes)comments.push({id:uid(),by:r.closedBy||"OwlOps",role:"manager",email:"",text:r.closeNotes,ts:r.closedAt||r.createdAt});
  if(r.closedAt)activity.push({ts:r.closedAt,by:r.closedBy||"OwlOps",role:"manager",action:"status",toStatus:"closed",note:"Closed in OwlOps"});
  const t={
    shortId, storeId:r.sid, category:cat, subcategory:sub,
    priority:r.pri, description:r.desc, photos:[],
    status:r.closedAt?"closed":((aTech||aVend)?"dispatched":"unassigned"),
    assignedVendorId:aVend, assignedTechId:aTech,
    asset:r.asset||"", externalRef:r.ref, externalSource:"owlops",
    owlops:{region:r.owlRegion,subregion:r.owlSubregion,vendor:r.owlVendor,
            timeLogged:r.owlTime,costLogged:r.owlCost,parts:r.owlParts,
            closeDays:r.owlCloseDays,assetRaw:r.owlAssetRaw,
            assignedTo:r.assignRaw,department:r.dept},
    createdBy:"", createdByRole:"manager", createdByName:r.createdByName||"OwlOps import",
    createdAt:r.createdAt, updatedAt:r.updatedAt||r.createdAt,
    activity, comments
  };
  if(r.closedAt)t.finishedAt=r.closedAt;
  if((aTech||aVend)&&!r.closedAt){
    t.dispatchedAt=r.createdAt;
    const nm=aTech?((MASTER.repairTechnicians||{})[aTech]||{}).name:(VENDORS[aVend]||{}).name;
    activity.push({ts:r.createdAt,by:r.createdByName||"OwlOps",role:"manager",action:"assign",toStatus:"dispatched",note:"Assigned in OwlOps to "+(nm||"tech")});
  }
  try{
    await apiWrite(`${TICKETS_NODE}/${id}`,t);
    TICKETS[id]=t; LOCAL_ECHO[id]=t;
    r.done=shortId; r.skip=true; IMP_DONE++;
    toast("Imported "+shortId);
    IMP_I++; renderImportStep();
  }catch(e){
    IMP_FAIL++;
    if(btn){btn.disabled=false;btn.innerHTML="✓ Import this ticket"}
    toast(e.message||"Could not save that ticket","err");
  }
}


/* ============================================================ EQUIPMENT INVENTORY
   Burger King stores only. For each tracked item a DM uploads 1–3 photos (one
   showing the model + serial plate is REQUIRED and is what completes the item;
   the other two are optional extras), or marks it N/A when the store doesn't
   have that equipment. Both count as complete.
   Record shape: {photos:[url,...], photo:<photos[0] legacy mirror>, na, by, at,
   rejectNote/By/At}. Stored at admins/equipInv/{storeId} — the only node prefix
   FixMi may write besides tickets and vendors. Visible to the store's DM, their
   Director, and Overwatch. */
function equipItems(){
  const eq=(catsForDivision("bk")||[]).find(c=>c.key==="equipment");
  // "Other" isn't a physical asset, so it isn't part of the inventory.
  const base=((eq&&eq.subs)||[]).filter(x=>x.key!=="equipment_other");
  // Categories can be overridden by a server-stored list (admins/divisionCategories)
  // that may predate these items — merge them in so the inventory always has them.
  const extras=[
    {key:"equipment_lobby_drink_machine",label:"Lobby Drink Machine"},
    {key:"equipment_under_counter_cooler",label:"Under-Counter Cooler"},
    {key:"equipment_vegetable_slicer",label:"Vegetable Slicer"}
  ];
  const have=new Set(base.map(x=>x.key));
  return base.concat(extras.filter(x=>!have.has(x.key)));
}
function invFor(sid){return ((MASTER.admins||{}).equipInv||{})[sid]||{}}
/* Every photo on an item, newest schema first: `photos` is the array going
   forward; a legacy record's single `photo` string still counts as one. */
function invPhotos(e){
  if(!e)return [];
  if(Array.isArray(e.photos))return e.photos.filter(Boolean);
  return e.photo?[e.photo]:[];
}
function invDone(sid){
  const rec=invFor(sid), items=equipItems();
  // ONE photo (or N/A) is what completes an item; extra photos are optional.
  return items.filter(x=>{const e=rec[x.key];return e&&(e.na||invPhotos(e).length>0)}).length;
}
/* BK stores in the viewer's scope. Overwatch sees all, others their own. */
function invStores(){
  const ids=(SESSION.role==="admin")?Object.keys(RESTAURANTS):myStoreIds();
  return ids.filter(sid=>storeDivision(sid)==="bk").sort((a,b)=>storeName(a).localeCompare(storeName(b)));
}
function canSeeInventory(){return ["coach","director","admin"].includes(SESSION.role)&&invStores().length>0}
function invHubButton(){
  if(!canSeeInventory())return "";
  const stores=invStores(), per=equipItems().length;
  const done=stores.reduce((n,sid)=>n+invDone(sid),0), total=stores.length*per;
  // Everything recorded → the big card shrinks to a slim green success line
  // (still tappable, so photos stay reviewable/replaceable).
  if(total&&done>=total)
    return `<button class="inv-success" style="margin-bottom:20px" onclick="openInventory()">✓ Equipment inventory complete · ${total} of ${total} recorded</button>`;
  const pct=total?Math.round(done/total*100):0;
  return `<button class="hub-btn inv-btn" style="width:100%;margin-bottom:20px" onclick="openInventory()">
    <div class="hb-ic">🧾</div>
    <div class="hb-t">Equipment inventory <span class="inv-frac">${done} / ${total}</span></div>
    <div class="hb-d">Model &amp; serial photos for each piece of equipment.</div>
    <div class="inv-bar"><div class="inv-fill" style="width:${pct}%"></div></div>
  </button>`;
}
/* Slim inventory strip for the Overwatch panel's Map and List views (the Tiles
   hub already shows the full card). One tap opens the same store picker. */
function invOwBar(){
  if(!canSeeInventory())return "";
  const stores=invStores(), per=equipItems().length;
  const done=stores.reduce((n,sid)=>n+invDone(sid),0), total=stores.length*per;
  if(total&&done>=total)
    return `<button class="inv-success" style="margin-bottom:14px" onclick="openInventory()">✓ Equipment inventory complete · ${stores.length} store${stores.length===1?"":"s"}</button>`;
  const pct=total?Math.round(done/total*100):0;
  return `<button class="inv-ow" onclick="openInventory()">
    <span>🧾 Equipment inventory</span><span class="inv-frac">${done} / ${total}</span>
    <span class="inv-bar sm" style="display:block;flex:1;min-width:60px;margin-top:0"><span class="inv-fill" style="width:${pct}%;display:block"></span></span>
  </button>`;
}
/* Store picker */
function openInventory(){
  const stores=invStores(), per=equipItems().length;
  const rows=stores.map(sid=>{
    const d=invDone(sid), pct=per?Math.round(d/per*100):0;
    return `<button class="inv-row${d>=per&&per?" full":""}" onclick="openInventoryStore('${sid}')">
      <div style="flex:1;min-width:0">
        <div class="inv-name">${esc(storeName(sid))}</div>
        <div class="inv-bar sm"><div class="inv-fill" style="width:${pct}%"></div></div>
      </div>
      <span class="inv-count${d>=per?" full":""}">${d} / ${per}</span>
    </button>`;}).join("");
  modal(`<div class="sheet-head"><h2>Equipment inventory</h2><button class="x-btn" onclick="closeModal()">✕</button></div>
    <div class="sheet-body">
      <p style="color:var(--ink-dim);font-size:13px;margin-top:0">Burger King stores. For each item, add <b>1–3 photos</b> — at least one must show the model and serial plate — or mark it N/A if the store doesn't have it.</p>
      ${rows||'<div class="rp-empty">No Burger King stores in your scope.</div>'}
    </div>`);
}
/* The tracked items for one store */
let INV_SID=null;
function openInventoryStore(sid){
  INV_SID=sid;
  const rec=invFor(sid), items=equipItems();
  const done=invDone(sid), per=items.length;
  const rows=items.map(x=>{
    const e=rec[x.key]||{};
    const phs=invPhotos(e);                       // 0–3 photos (legacy `photo` counts)
    const recorded=phs.length>0||!!e.na;
    // A rejected item counts as NOT done, and carries Overwatch's reason until
    // the DM replaces it — that's how the fraction drops and they learn why.
    const rejected=!recorded&&!!e.rejectNote;
    const state=e.na?"na":(phs.length?"done":(rejected?"rej":"todo"));
    const who=e.by?`${esc(e.by)}${e.at?" · "+fmtDateShort(e.at):""}`:"";
    const isOw=SESSION.role==="admin";
    const thumbs=phs.length
      ?`<div class="inv-thumbs">${phs.map((u,i)=>`<div class="inv-thumb">
          <img src="${escA(u)}" loading="lazy" decoding="async" alt="" onclick="openPhoto('${escA(u)}')">
          <button class="inv-ph-x" title="Remove photo" onclick="invRemovePhoto('${x.key}',${i})">✕</button>
        </div>`).join("")}</div>`
      :`<div class="inv-thumb">${e.na?`<span class="inv-na">N/A</span>`:`<span class="inv-todo">${rejected?"!":"—"}</span>`}</div>`;
    return `<div class="inv-item ${state}">
      ${thumbs}
      <div style="flex:1;min-width:0">
        <div class="inv-label">${esc(x.label)}</div>
        ${who&&recorded?`<div class="inv-by">${who}${phs.length?` · ${phs.length}/3 photo${phs.length>1?"s":""}`:""}</div>`:(rejected?"":`<div class="inv-by">Not recorded yet</div>`)}
        ${rejected?`<div class="inv-rej"><b>Rejected by ${esc(e.rejectBy||"Overwatch")}${e.rejectAt?" · "+fmtDateShort(e.rejectAt):""}</b>${esc(e.rejectNote)}</div>`:""}
      </div>
      <div class="inv-acts">
        ${phs.length<3?`<button class="btn btn-ghost btn-sm" onclick="invPick('${x.key}')">${phs.length?"➕ Add photo":(rejected?"📷 Retake":"📷 Photo")}</button>`:""}
        <button class="btn btn-ghost btn-sm${e.na?" tk-cur":""}" onclick="invSetNA('${x.key}',${e.na?"false":"true"})">${e.na?"✓ N/A":"N/A"}</button>
        ${(isOw&&recorded)?`<button class="btn btn-danger btn-sm" onclick="invReject('${x.key}')">✕ Reject</button>`:""}
      </div>
    </div>`;}).join("");
  modal(`<div class="sheet-head"><h2>${esc(storeName(sid))}</h2><button class="x-btn" onclick="openInventory()">✕</button></div>
    <div class="sheet-body">
      ${per&&done>=per
        ?`<div class="inv-success" style="margin-bottom:12px">✓ All ${per} items recorded — inventory complete</div>`
        :`<div class="inv-head"><b>${done} of ${per}</b> recorded
        <div class="inv-bar"><div class="inv-fill" style="width:${per?Math.round(done/per*100):0}%"></div></div></div>`}
      <input type="file" id="invFile" accept="image/*" multiple style="display:none" onchange="invUpload(this)">
      ${rows}
    </div>
    <div class="sheet-foot"><button class="btn btn-ghost btn-block" onclick="openInventory()">Back to stores</button></div>`);
}
let INV_KEY=null;
function invPick(key){INV_KEY=key;$("invFile").click();}
async function invUpload(input){
  const files=[...(input.files||[])]; input.value="";
  if(!files.length||!INV_KEY||!INV_SID)return;
  const key=INV_KEY, sid=INV_SID;
  const existing=invPhotos((invFor(sid))[key]);
  const room=3-existing.length;
  if(room<=0){toast("This item already has 3 photos — remove one first","err");return}
  if(files.length>room)toast(`Only ${room} more photo${room>1?"s":""} fit — extra skipped`);
  const take=files.slice(0,room);
  toast(`Uploading ${take.length>1?take.length+" photos":"photo"}…`);
  try{
    const urls=[];
    for(const f of take)urls.push(await uploadPhoto(f));
    await invSave(sid,key,{photos:existing.concat(urls),na:false,rejectNote:"",rejectBy:"",rejectAt:0});
  }catch(e){toast(e.message||"Photo upload failed","err")}
}
/* Remove one of an item's photos. Anyone who can open this sheet (DM/coach,
   Director, Overwatch) can delete. Extras go instantly; removing the LAST
   photo un-completes the item and drops the count, so that one asks first. */
function invRemovePhoto(key,idx){
  const sid=INV_SID; if(!sid)return;
  const e=(invFor(sid))[key]||{};
  if(invPhotos(e).length<=1){
    const item=equipItems().find(x=>x.key===key);
    modal(`<div class="sheet-head"><h2>Remove this photo?</h2><button class="x-btn" onclick="openInventoryStore('${sid}')">✕</button></div>
      <div class="sheet-body">
        <p style="margin:0;font-size:14px"><b>${esc(item?item.label:key)}</b> at ${esc(storeName(sid))}</p>
        <p style="margin:10px 0 0;font-size:13px;color:var(--ink-mid)">This is the item's only photo. Removing it puts the item back to <b>Not recorded</b> and the store's progress count drops by one.</p>
      </div>
      <div class="sheet-foot">
        <button class="btn btn-ghost" style="flex:1" onclick="openInventoryStore('${sid}')">Cancel</button>
        <button class="btn btn-danger" style="flex:1" onclick="invDoRemovePhoto('${key}',${idx})">Remove photo</button>
      </div>`);
    return;
  }
  invDoRemovePhoto(key,idx);
}
async function invDoRemovePhoto(key,idx){
  const sid=INV_SID; if(!sid)return;
  const e=(invFor(sid))[key]||{};
  const phs=invPhotos(e).slice();
  phs.splice(idx,1);
  await invSave(sid,key,{photos:phs,na:false,
    rejectNote:e.rejectNote||"",rejectBy:e.rejectBy||"",rejectAt:e.rejectAt||0});
  toast(phs.length?"Photo removed":"Photo removed — item back to Not recorded");
}
/* Overwatch rejects a recorded item with a reason. The photo is cleared so the
   store's fraction drops, and the reason stays visible to the DM until they
   record it again. */
function invReject(key){
  const sid=INV_SID; if(!sid)return;
  const item=equipItems().find(x=>x.key===key);
  modal(`<div class="sheet-head"><h2>Reject this photo?</h2><button class="x-btn" onclick="openInventoryStore('${sid}')">✕</button></div>
    <div class="sheet-body">
      <p style="margin:0;font-size:14px"><b>${esc(item?item.label:key)}</b> at ${esc(storeName(sid))}</p>
      <div class="field" style="margin-top:12px"><label class="label">Why is it being rejected?</label>
        <textarea class="input" id="invRejNote" rows="3" placeholder="e.g. Serial plate isn't readable — please retake closer."></textarea>
        <div class="uz-h mono" style="margin-top:5px;color:var(--ink-dim)">All photos on this item are cleared, the District Manager sees this note, and their progress count drops by one.</div>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" style="flex:1" onclick="openInventoryStore('${sid}')">Cancel</button>
      <button class="btn btn-danger" style="flex:1" onclick="invDoReject('${key}')">Reject &amp; request retake</button>
    </div>`);
  setTimeout(()=>{const el=$("invRejNote");if(el)el.focus()},60);
}
async function invDoReject(key){
  const sid=INV_SID; if(!sid)return;
  const note=(($("invRejNote")||{}).value||"").trim();
  if(!note){toast("Add a short reason","err");return}
  await invSave(sid,key,{photos:[],na:false,rejectNote:note,rejectBy:SESSION.name,rejectAt:now()});
  toast("Rejected — retake requested");
}
async function invSetNA(key,on){
  const sid=INV_SID; if(!sid)return;
  await invSave(sid,key,on?{na:true,photos:[],rejectNote:"",rejectBy:"",rejectAt:0}:{na:false,photos:[]});
}
/* Optimistic write — this endpoint is rarely warm, so don't make them wait. */
async function invSave(sid,key,val){
  const photos=Array.isArray(val.photos)?val.photos.filter(Boolean).slice(0,3):invPhotos(val);
  // `photos` is the schema going forward; `photo` mirrors photos[0] so any
  // not-yet-reloaded older client still renders something sensible.
  const rec={...val,photos,photo:photos[0]||"",by:SESSION.name,at:now()};
  MASTER.admins=MASTER.admins||{};
  MASTER.admins.equipInv=MASTER.admins.equipInv||{};
  const node=MASTER.admins.equipInv[sid]=MASTER.admins.equipInv[sid]||{};
  const prev=node[key];                    // kept for rollback
  node[key]=rec;
  INV_ECHO[sid+"/"+key]=rec;               // survives refresh() until the CDN catches up
  openInventoryStore(sid);
  try{
    await apiWrite(`admins/equipInv/${sid}/${key}`,rec);
    refreshInBackground();
  }catch(e){
    // Restore what was there before — deleting outright would locally wipe a
    // previously-saved photo just because a *replace* attempt failed.
    if(prev)node[key]=prev; else delete node[key];
    delete INV_ECHO[sid+"/"+key];
    toast((e.message||"Could not save")+" — not saved","err");
    openInventoryStore(sid);
  }
}


/* ============================================================ CLOSED TICKET REPORT (overwatch)
   How many tickets were closed in a window, and the split by category, as a
   bar chart meant to be screenshotted. Closed tickets are lazily loaded, so
   this pulls them first. */
let CR_DAYS=30, CR_MODE="cat", CR_FILTER=null;   // CR_FILTER = {dim,key,label}
/* When was this ticket actually closed? The activity trail is authoritative;
   updatedAt is the fallback for imports and older records. */
function closedAt(t){
  const acts=Array.isArray(t.activity)?t.activity:[];
  for(let i=acts.length-1;i>=0;i--){
    const a=acts[i];
    if(a&&a.toStatus==="closed"&&a.ts) return a.ts;
  }
  return t.updatedAt||t.finishedAt||t.createdAt||0;
}
async function openClosedReport(days){
  if(days){CR_DAYS=days;}
  await ensureClosedLoaded();      // closed tickets aren't in the default payload
  renderClosedReport();
}
function crSetMode(m){CR_MODE=m;renderClosedReport()}
function crDrill(dim,key){CR_FILTER={dim,key,label:crLabel(dim,key)};renderClosedReport()}
function crBack(){CR_FILTER=null;renderClosedReport()}

/* One row per dimension value. "item" = subcategory, which is where persistent
   problems show up (same asset failing over and over). */
function crKey(t,dim){
  if(dim==="cat")   return t.category||"__none";
  if(dim==="store") return t.storeId||"__none";
  return t.subcategory||"";          // blank items are skipped, not bucketed
}
function crLabel(dim,key){
  if(dim==="cat")   return key==="__none"?"Uncategorised":(ALL_CATEGORIES[key]||key);
  if(dim==="store") return key==="__none"?"Unknown store":storeName(key);
  const parent=(SUBCATEGORIES[key]||{}).parent;
  return (subLabel(key)||key)+(parent?` · ${ALL_CATEGORIES[parent]||parent}`:"");
}
function crRows(){
  const since=now()-CR_DAYS*86400000;
  return Object.values(TICKETS).filter(t=>{
    if(t.status!=="closed"||closedAt(t)<since)return false;
    if(CR_FILTER&&crKey(t,CR_FILTER.dim)!==CR_FILTER.key)return false;
    return true;
  });
}
function crGroup(rows,dim){
  const by={};
  rows.forEach(t=>{
    const k=crKey(t,dim);
    if(dim==="item"&&!k)return;      // ticket has no subcategory
    if(!by[k])by[k]={key:k,label:crLabel(dim,k),n:0};
    by[k].n++;
  });
  return Object.values(by).sort((a,b)=>b.n-a.n||a.label.localeCompare(b.label));
}
function crBars(list,dim,clickable){
  if(!list.length)return `<div class="rp-empty" style="padding:14px">Nothing to show.</div>`;
  const max=list[0].n;
  return `<div class="cr-chart">${list.map(c=>{
    const w=max?Math.max(2,Math.round(c.n/max*100)):0;
    const tag=clickable?`<button class="cr-row cr-click" onclick="crDrill('${dim}','${escA(c.key)}')">`:`<div class="cr-row">`;
    const end=clickable?`</button>`:`</div>`;
    return `${tag}
      <div class="cr-label">${esc(c.label)}</div>
      <div class="cr-track"><div class="cr-bar" style="width:${w}%"></div></div>
      <div class="cr-n">${c.n}</div>${end}`;}).join("")}</div>`;
}

function renderClosedReport(){
  const rows=crRows();
  const total=rows.length;
  const since=now()-CR_DAYS*86400000;
  const from=new Date(since).toLocaleDateString("en-US",{month:"short",day:"numeric"});
  const to=new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  const pick=[30,60,90].map(d=>`<button class="ce-tab${CR_DAYS===d?" on":""}" onclick="openClosedReport(${d})">${d}d</button>`).join("");

  let body,heroSub,backBtn="";
  if(CR_FILTER){
    // Drilled in: show the two OTHER dimensions inside this slice.
    backBtn=`<button class="cr-back" onclick="crBack()">‹ All closed tickets</button>`;
    heroSub=`closed in <b>${esc(CR_FILTER.label)}</b><br><span class="mono">last ${CR_DAYS} days · ${esc(from)} – ${esc(to)}</span>`;
    const other=CR_FILTER.dim==="store"
      ? [["cat","By category"],["item","By item"]]
      : [["store","By store"],["item","By item"]];
    body=other.map(([d,t])=>{
      const list=crGroup(rows,d);
      return `<div class="section-label" style="margin-top:16px">${t}<span class="ln"></span></div>
        ${crBars(list,d,d!==CR_FILTER.dim)}`;}).join("");
  }else{
    const modes=[["cat","Category"],["store","Store"],["item","Item"]];
    const tabs=modes.map(([k,l])=>`<button class="ce-tab${CR_MODE===k?" on":""}" onclick="crSetMode('${k}')">${l}</button>`).join("");
    const list=crGroup(rows,CR_MODE);
    const top=list[0];
    heroSub=`closed in the last ${CR_DAYS} days<br><span class="mono">${esc(from)} – ${esc(to)}</span>`;
    const hint=CR_MODE==="item"
      ? `<p class="cr-hint">Items repeating across the window are your persistent problems.</p>`
      : (CR_MODE==="store"?`<p class="cr-hint">Ranked by volume — the busiest store is first.</p>`:"");
    body=`<div class="ce-tabs" style="margin-top:16px">${tabs}</div>
      ${top?`<div class="cr-top">Most: <b>${esc(top.label)}</b> · ${top.n}</div>`:""}
      ${hint}
      ${crBars(list,CR_MODE,true)}
      <p class="cr-hint" style="margin-top:10px">Tap any bar to break it down.</p>`;
  }

  const emerg=rows.filter(t=>t.priority==="emergency").length;
  const stores=new Set(rows.map(t=>t.storeId)).size;
  const durs=rows.map(t=>closedAt(t)-(t.createdAt||0)).filter(d=>d>0).sort((a,b)=>a-b);
  const medDays=durs.length?(durs[Math.floor(durs.length/2)]/86400000).toFixed(1):"—";

  modal(`<div class="sheet-head"><h2>Closed tickets</h2><button class="x-btn" onclick="closeModal()">✕</button></div>
    <div class="sheet-body">
      ${backBtn}
      <div class="ce-tabs" style="margin-bottom:14px">${pick}</div>
      <div class="cr-hero">
        <div class="cr-big">${total}</div>
        <div class="cr-sub">${heroSub}</div>
      </div>
      <div class="imp-summary" style="margin:14px 0 4px">
        <div class="rp-stat"><div class="rp-n">${stores}</div><div class="rp-l">stores</div></div>
        <div class="rp-stat"><div class="rp-n">${emerg}</div><div class="rp-l">emergencies</div></div>
        <div class="rp-stat"><div class="rp-n">${medDays}</div><div class="rp-l">median days open</div></div>
      </div>
      ${total?body:`<div class="rp-empty">No tickets were closed in this window.</div>`}
    </div>
    <div class="sheet-foot"><button class="btn btn-ghost btn-block" onclick="closeModal()">Done</button></div>`);
}

/* ============================================================ JOB COSTS
   "How much did this repair cost?" — matches PayMi invoices to FixMi tickets.

   DATA
   ----
   PayMi invoices are read straight from its Firestore over REST (read-only,
   same key the pending-approval banner already uses, but paginated so the
   whole collection comes back, not just the first 300).
   The match itself is written to THIS app's master under admins/jobCosts:

     admins/jobCosts/<linkId> = {
       id, invId, ticketId, amount,          // dollars placed on this ticket
       storeId,                              // ticket's store (for rollups)
       inv:{vendor,invoiceNumber,amount,storeName,status,fileUrl,createdAt},
       by, byName, at                        // who matched, when
     }
     A "not a repair" dismissal is the same record with ticketId:null, skip:true.

   One invoice can be split across several tickets (parts + labor, or a vendor
   who billed two jobs on one ticket) and one ticket can carry several
   invoices; amounts are per link, so the ticket cost is just the sum.
   ============================================================ */
const COSTS_NODE="admins/jobCosts";
const PAYMI_ALL=PAYMI_FS;                 // same URL; we page through it
let COST_ECHO={};                          // linkId -> rec we just wrote, or {__deleted,at}
let PM_INV=null, PM_FETCHED_AT=0, PM_ERR=null, PM_BUSY=false;
const PM_TTL_MS=5*60*1000;
/* panel state */
let JC={tab:"match", sel:null, q:"", store:"all", show:"open", tq:"", allStores:false,
        focusTicket:null, jobsQ:"", period:90, moreInv:false};

function fmtMoney(n){
  n=Number(n)||0;
  return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function costLinks(){return ((MASTER&&MASTER.admins)||{}).jobCosts||{}}
function linksForTicket(tid){return Object.values(costLinks()).filter(l=>l&&l.ticketId===tid)}
function linksForInvoice(iid){return Object.values(costLinks()).filter(l=>l&&l.invId===iid)}
function ticketCost(tid){return linksForTicket(tid).reduce((s,l)=>s+(Number(l.amount)||0),0)}
function invAllocated(iid){return linksForInvoice(iid).filter(l=>!l.skip).reduce((s,l)=>s+(Number(l.amount)||0),0)}
function invSkipped(iid){return linksForInvoice(iid).some(l=>l.skip)}
function invRemaining(inv){return Math.round(((Number(inv.amount)||0)-invAllocated(inv.id))*100)/100}
/* MATCHED = fully placed on jobs · PART = some placed · SKIP = not a repair · OPEN = nothing yet */
function invMatchState(inv){
  if(invSkipped(inv.id))return"SKIP";
  const a=invAllocated(inv.id);
  if(a<=0)return"OPEN";
  return invRemaining(inv)<=0.005?"MATCHED":"PART";
}
function invStoreIds(inv){
  if(Array.isArray(inv.storeIds)&&inv.storeIds.length)return inv.storeIds;
  return inv.storeId?[inv.storeId]:[];
}
function pmById(id){return (PM_INV||[]).find(i=>i.id===id)||null}

/* ---- PayMi read (paginated) ---- */
function pmDecode(d){
  const f=d.fields||{}, o={};
  for(const k in f)o[k]=fsVal(f[k]);
  o.id=String(d.name||"").split("/").pop();
  o.amount=Number(o.amount)||0;
  return o;
}
async function pmFetchAll(force){
  if(!force&&PM_INV&&(Date.now()-PM_FETCHED_AT)<PM_TTL_MS)return PM_INV;
  if(PM_BUSY)return PM_INV;
  PM_BUSY=true;
  try{
    let url=PAYMI_ALL, out=[], guard=0;
    while(url&&guard++<40){
      const r=await fetchWithTimeout(url,{cache:"no-store"},25000);
      if(!r.ok)throw new Error("PayMi read failed · HTTP "+r.status);
      const j=await r.json();
      (j.documents||[]).forEach(d=>out.push(pmDecode(d)));
      url=j.nextPageToken?PAYMI_ALL+"&pageToken="+encodeURIComponent(j.nextPageToken):null;
    }
    out.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    PM_INV=out; PM_FETCHED_AT=Date.now(); PM_ERR=null;
    console.log("[JobCosts] "+out.length+" PayMi invoices loaded");
  }catch(e){
    PM_ERR=(e&&e.message)||"PayMi unreachable";
    if(!PM_INV)PM_INV=[];
    console.warn("[JobCosts] "+PM_ERR);
  }finally{PM_BUSY=false}
  return PM_INV;
}

/* ---- open the panel ---- */
async function openJobCosts(tab,opts){
  if(SESSION.role!=="admin")return;
  if(tab)JC.tab=tab;
  opts=opts||{};
  if(opts.ticket){JC.focusTicket=opts.ticket;JC.sel=null;JC.tab="match";JC.store=(TICKETS[opts.ticket]||{}).storeId||"all";JC.show="open";}
  else if(!opts.keep){JC.focusTicket=null;}
  showLoader(true);
  try{
    // Invoices almost always arrive after the job is closed, and closed tickets
    // aren't in the default payload — pull both before drawing anything.
    await Promise.all([pmFetchAll(false),ensureClosedLoaded()]);
  }finally{showLoader(false)}
  renderJobCosts();
}
async function jcReload(){
  showLoader(true);
  try{await Promise.all([pmFetchAll(true),refresh()])}catch(e){}
  finally{showLoader(false)}
  renderJobCosts(); toast("Invoices refreshed");
}
function jcSet(k,v){JC[k]=v;renderJobCosts()}
function jcSelect(id){
  JC.sel=(JC.sel===id?null:id);JC.moreInv=false;JC.tq="";JC.allStores=false;renderJobCosts();
  // Phones stack the two columns — bring the jobs into view once an invoice is picked.
  if(JC.sel&&window.innerWidth<=760){const col=document.querySelector(".jc-ledger > div:nth-child(2)");if(col)setTimeout(()=>col.scrollIntoView({behavior:"smooth",block:"start"}),30);}
}
function jcSearch(el,key){
  JC[key]=el.value; const caret=el.selectionStart;
  renderJobCosts();
  const n=$(el.id); if(n){n.focus();try{n.setSelectionRange(caret,caret)}catch(e){}}
}

/* ---- ranking: which tickets probably belong to this invoice ---- */
function normTxt(s){return String(s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()}
function vendorTokens(s){return normTxt(s).split(" ").filter(w=>w.length>2&&!["inc","llc","the","and","co","corp","services","service","company"].includes(w))}
function vendorLooksLike(a,b){
  const ta=vendorTokens(a), tb=vendorTokens(b);
  if(!ta.length||!tb.length)return false;
  return ta.some(w=>tb.includes(w));
}
function ticketVendorName(t){
  if(t.assignedVendorId&&VENDORS[t.assignedVendorId])return VENDORS[t.assignedVendorId].name;
  if(t.assignedTechId)return techName(t.assignedTechId)||"";
  return"";
}
function jcCandidates(inv){
  const sids=invStoreIds(inv), invAt=inv.createdAt||0, q=normTxt(JC.tq);
  const rows=[];
  Object.entries(TICKETS).forEach(([id,t])=>{
    if(!t)return;
    const inStore=sids.includes(t.storeId);
    if(!JC.allStores&&!inStore&&!q)return;
    if(q){
      const hay=normTxt([t.shortId,t.description,catPath(t),storeName(t.storeId),ticketVendorName(t)].join(" "));
      if(!hay.includes(q))return;
    }
    let score=0, why=[];
    if(inStore)score+=30;
    const vn=ticketVendorName(t);
    if(vn&&vendorLooksLike(vn,inv.vendor)){score+=50;why.push("same vendor")}
    const finished=t.status==="closed"||t.status==="finished";
    if(finished)score+=8;
    // A job that wrapped up shortly before the invoice was filed is the usual case.
    // Only finished/closed jobs have a "done" date worth comparing.
    const done=finished?(t.status==="closed"?closedAt(t):(t.finishedAt||t.updatedAt||0)):0;
    if(invAt&&done){
      const days=(invAt-done)/86400000;
      if(days>=-3&&days<=60){score+=20-Math.min(15,Math.max(0,days/4));if(days<=21)why.push("done "+Math.max(0,Math.round(days))+"d before invoice")}
    }
    const already=linksForInvoice(inv.id).some(l=>l.ticketId===id);
    if(already)score-=1000;
    rows.push({id,t,score,why,already});
  });
  rows.sort((a,b)=>b.score-a.score||(b.t.createdAt||0)-(a.t.createdAt||0));
  return rows;
}

/* ---- writes ---- */
async function jcLink(invId,tid){
  const inv=pmById(invId), t=TICKETS[tid];
  if(!inv||!t){toast("Invoice or ticket not found — refresh","err");return}
  const el=$("jcAmt_"+invId+"_"+tid);
  const amt=Math.round((parseFloat(el&&el.value)||0)*100)/100;
  if(!(amt>0)){toast("Enter the amount to place on this job","err");return}
  const id=uid();
  const rec={id,invId,ticketId:tid,amount:amt,storeId:t.storeId,
    inv:{vendor:inv.vendor||"",invoiceNumber:inv.invoiceNumber||"",amount:inv.amount||0,
         storeName:inv.storeName||"",status:inv.status||"",fileUrl:inv.fileUrl||null,createdAt:inv.createdAt||0},
    by:SESSION.email,byName:SESSION.name,at:now()};
  MASTER.admins.jobCosts=MASTER.admins.jobCosts||{};
  MASTER.admins.jobCosts[id]=rec; COST_ECHO[id]=rec;
  // Stay on this invoice while money remains on it; otherwise hand back the list.
  if(invRemaining(inv)<=0.005&&!JC.focusTicket)JC.sel=null;
  renderJobCosts();
  toast(fmtMoney(amt)+" placed on #"+(t.shortId||tid.slice(0,6).toUpperCase()));
  render();
  try{await apiWrite(`${COSTS_NODE}/${id}`,rec);refreshInBackground();}
  catch(e){delete MASTER.admins.jobCosts[id];delete COST_ECHO[id];renderJobCosts();toast(e.message||"Save failed — link removed","err")}
}
async function jcSkip(invId){
  const inv=pmById(invId); if(!inv)return;
  const id=uid();
  const rec={id,invId,ticketId:null,skip:true,amount:0,storeId:null,
    inv:{vendor:inv.vendor||"",invoiceNumber:inv.invoiceNumber||"",amount:inv.amount||0,storeName:inv.storeName||"",status:inv.status||"",fileUrl:inv.fileUrl||null,createdAt:inv.createdAt||0},
    by:SESSION.email,byName:SESSION.name,at:now()};
  MASTER.admins.jobCosts=MASTER.admins.jobCosts||{};
  MASTER.admins.jobCosts[id]=rec; COST_ECHO[id]=rec; JC.sel=null;
  renderJobCosts(); toast("Marked as not a repair");
  try{await apiWrite(`${COSTS_NODE}/${id}`,rec);refreshInBackground();}
  catch(e){delete MASTER.admins.jobCosts[id];delete COST_ECHO[id];renderJobCosts();toast(e.message||"Save failed","err")}
}
async function jcUnlink(linkId,from){
  const rec=costLinks()[linkId]; if(!rec)return;
  delete MASTER.admins.jobCosts[linkId]; COST_ECHO[linkId]={__deleted:true,at:now()};
  if(from==="ticket"&&rec.ticketId)openTicket(rec.ticketId); else renderJobCosts();
  render();
  toast(rec.skip?"Invoice back in the queue":"Link removed");
  try{await apiWrite(`${COSTS_NODE}/${linkId}`,null);refreshInBackground();}
  catch(e){MASTER.admins.jobCosts[linkId]=rec;delete COST_ECHO[linkId];
    if(from==="ticket"&&rec.ticketId)openTicket(rec.ticketId); else renderJobCosts();
    toast(e.message||"Could not remove","err")}
}

/* ---- pieces ---- */
function invStoreLabel(inv){
  const ids=invStoreIds(inv);
  const names=ids.map(id=>RESTAURANTS[id]?storeName(id):null).filter(Boolean);
  return names.length?names.join(" + "):(inv.storeName||"—");
}
function invCard(inv){
  const st=invMatchState(inv), alloc=invAllocated(inv.id), pct=inv.amount?Math.min(100,alloc/inv.amount*100):0;
  const sel=JC.sel===inv.id;
  const when=inv.createdAt?new Date(inv.createdAt).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"2-digit"}):"";
  const mpill=st==="OPEN"?"":`<span class="ipill ${st}">${st==="MATCHED"?"matched":st==="PART"?"partly matched":"not a repair"}</span>`;
  return `<div class="inv${sel?" sel":""}${st==="MATCHED"||st==="SKIP"?" done":""}" onclick="jcSelect('${inv.id}')">
    <div class="inv-top"><div class="inv-vendor">${esc(inv.vendor||"(no vendor)")}</div><div class="inv-amt">${fmtMoney(inv.amount)}</div></div>
    <div class="inv-store">${esc(invStoreLabel(inv))}</div>
    <div class="inv-meta"><span class="mono">#${esc(inv.invoiceNumber||"—")}</span>${when?`<span>· ${esc(when)}</span>`:""}
      ${inv.status?`<span class="ipill ${esc(inv.status)}">${esc(inv.status.toLowerCase())}</span>`:""}${mpill}
      ${inv.fileUrl?`<a href="${escA(inv.fileUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--amber-deep);font-weight:600">📄 view</a>`:""}</div>
    ${alloc>0?`<div class="inv-meter"><i class="${st==="PART"?"part":""}" style="width:${pct}%"></i></div>`:""}
  </div>`;
}
function ticketLine(id,t){
  return `<span class="mono">#${esc(t.shortId||id.slice(0,6).toUpperCase())}</span> ${esc(storeName(t.storeId))} · ${esc((t.description||"").slice(0,60))}`;
}
function candCard(inv,c,idx){

function jcStoresTab(){
  const since=JC.period?now()-JC.period*86400000:0;

  Object.values(costLinks()).forEach(l=>{
    if(!l||!l.ticketId)return;
    const t=TICKETS[l.ticketId]; const sid=l.storeId||(t&&t.storeId); if(!sid)return;
    if(since&&!((t&&closedAt(t)>=since)||(l.at||0)>=since))return;

  const rows=Object.entries(by).map(([sid,amt])=>({sid,amt,jobs:n[sid].size})).sort((a,b)=>b.amt-a.amt);

async function saveSettings(){
  const inputs=[...document.querySelectorAll(".reply-in")];
  const btn=$("setSave");btn.disabled=true;btn.innerHTML='<span class="inline-spin"></span>';
  try{
    // each reply number is written onto that person's admin record (admins/{id}).
    // create a minimal record if one doesn't exist yet for a fixed admin email.
    for(const i of inputs){
      const email=i.getAttribute("data-email").toLowerCase();
      const num=i.value.trim();
      let id=adminIdByEmail(email);
      if(id){
        const rec={...MASTER.admins[id],replyNumber:num||null};
        await apiWrite(`admins/${id}`,rec);
      }else{
        // no record yet → create one keyed by a generated id
        const newId="adm_"+uid();
        await apiWrite(`admins/${newId}`,{id:newId,email,name:email.split("@")[0],tier:"overwatch",replyNumber:num||null});
      }
    }
    // Default home view per role (shared setting).
    const vd={};
    document.querySelectorAll("#vdRows .vd-row").forEach(r=>{vd[r.getAttribute("data-role")]=r.querySelector("select").value});
    await apiWrite("admins/viewDefaults",vd);
    MASTER.admins=MASTER.admins||{};MASTER.admins.viewDefaults=vd;loadViewDefaults();
    // Apply locally right away; the CDN copy of admins/* can lag ~60s.
    for(const i of inputs){const em=i.getAttribute("data-email").toLowerCase();const n=i.value.trim();if(n)REPLY_NUMBERS[em]=n;else delete REPLY_NUMBERS[em];}
    refreshInBackground();
    toast("Settings saved");closeModal();
  }catch(e){toast(e.message||"Could not save","err");btn.disabled=false;btn.textContent="Save"}
}

      <button class="btn btn-ghost btn-block" style="margin-top:14px" onclick="editVendor(null)">＋ Add vendor</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="openVendorMap()">🗺 Vendor coverage map</button>
    </div>
    <div class="sheet-foot"><button class="btn btn-ghost btn-block" onclick="closeModal()">Done</button></div>`);
}
/* Edit an in-house tech's specialties + colour. Identity stays in FindMi. */
function editTechMeta(id){
  const t=(MASTER.repairTechnicians||{})[id]||{};
  const cur=techCategories({...t,id});
  const curColor=techColorFor(id);
  modal(`<div class="sheet-head"><h2>${esc(t.name||"Technician")}</h2><button class="x-btn" onclick="openVendors()">✕</button></div>
    <div class="sheet-body">
      <p style="color:var(--ink-dim);font-size:13px;margin-top:0">Name, email and phone are managed in FindMi. Specialties and colour save to both apps.</p>
      <div class="field"><label class="label">Specialties <span style="font-weight:400;color:var(--ink-dim)">(none ticked = general, handles everything)</span></label>
        <div id="tmCats">${categoryGroupsByDivision().map(g=>`
          <div class="div-group"><div class="div-head">${esc(g.label)}</div>
            <div class="cat-grid">${g.cats.map(c=>
              `<label class="cat-chk"><input type="checkbox" value="${c.key}"${cur.includes(c.key)?" checked":""}><span>${esc(c.label)}</span></label>`).join("")}</div>
          </div>`).join("")}</div></div>
      <div class="field" style="margin-top:14px"><label class="label">Zone colour</label>
        <div class="sw-row" id="tmSw">${ZONE_PALETTE.map(c=>
          `<button type="button" class="sw${c.toLowerCase()===String(curColor).toLowerCase()?" on":""}" style="background:${c}" data-c="${c}" onclick="pickTmColor('${c}')"></button>`).join("")}</div>
        <input type="hidden" id="tmColor" value="${escA(curColor)}"></div>
    </div>
    <div class="sheet-foot"><button class="btn btn-ghost" style="flex:1" onclick="openVendors()">Cancel</button>
      <button class="btn btn-primary" style="flex:1" id="tmSave" onclick="saveTechMeta('${id}')">Save</button></div>`);
}
/* Ticking a whole category clears its individual items (and vice versa) so a
   vendor is never stored as "all of X plus some of X". */
function vcatToggle(el){
  const block=el.closest(".vcat-block"); if(!block)return;
  if(el.checked) block.querySelectorAll("input[data-sub]").forEach(i=>i.checked=false);
}
function pickTmColor(c){
  $("tmColor").value=c;
  document.querySelectorAll("#tmSw .sw").forEach(b=>b.classList.toggle("on",(b.getAttribute("data-c")||"").toLowerCase()===c.toLowerCase()));
}
async function saveTechMeta(id){
  const cats=[...document.querySelectorAll("#tmCats input:checked")].map(c=>c.value);
  const color=$("tmColor").value||techColorFor(id);
  const rec={categories:cats,color,updatedAt:now()};
  const btn=$("tmSave");if(btn){btn.disabled=true;btn.innerHTML='<span class="inline-spin"></span>'}
  // optimistic — this endpoint is rarely warm
  MASTER.admins=MASTER.admins||{};MASTER.admins.techMeta=MASTER.admins.techMeta||{};
  const prev=MASTER.admins.techMeta[id];
  MASTER.admins.techMeta[id]=rec;
  toast("Technician updated");openVendors();
  apiWrite(`admins/techMeta/${id}`,rec).then(()=>refreshInBackground()).catch(e=>{
    if(prev)MASTER.admins.techMeta[id]=prev;else delete MASTER.admins.techMeta[id];
    toast((e.message||"Could not save")+" — not saved","err");openVendors();
  });
}
function editVendor(id){
  const v=id?VENDORS[id]:{};
  // Pre-check the new multi-select from the stored array. Legacy free-text
  // categories can't be mapped reliably, so we show the old value for reference
  // and require a fresh pick (per spec: force picking from the new list).
  const preCats=Array.isArray(v.categories)?v.categories:[];
  const legacyNote=(!preCats.length && v.category)
    ? `<div class="cat-legacy">Previously: <b>${esc(v.category)}</b> — pick the matching categories above.</div>`
    : "";
  modal(`<div class="sheet-head"><h2>${id?"Edit third-party tech":"Add third-party tech"}</h2><button class="x-btn" onclick="openVendors()">✕</button></div>
    <div class="sheet-body">
      <div class="field"><label class="label">Tech / company name</label><input class="input" id="vName" value="${escA(v.name||"")}" placeholder="e.g. Lone Star HVAC"></div>
      <div class="field" style="margin-top:14px"><label class="label">Coverage <span style="font-weight:400;color:var(--ink-dim)">(a whole category, or just the items they actually handle)</span></label>
        <div id="vCats">${categoryGroupsByDivision().map(g=>`
          <div class="div-group"><div class="div-head">${esc(g.label)}</div>
            <div class="cat-grid">${g.cats.map(c=>{
              const subs=c.subs||[];
              const kids=subs.map(sb=>`<label class="cat-chk sub"><input type="checkbox" data-sub="${sb.key}" value="${sb.key}"${preCats.includes(sb.key)?" checked":""}><span>${esc(sb.label)}</span></label>`).join("");
              return `<div class="vcat-block">
                <label class="cat-chk"><input type="checkbox" data-cat="${c.key}" value="${c.key}"${preCats.includes(c.key)?" checked":""} onchange="vcatToggle(this)"><span><b>${esc(c.label)}</b>${subs.length?" — all":""}</span></label>
                ${subs.length?`<button type="button" class="vcat-more" onclick="this.nextElementSibling.classList.toggle('open');this.textContent=this.nextElementSibling.classList.contains('open')?'▾ hide items':'▸ pick specific items'">▸ pick specific items</button>
                <div class="vcat-subs">${kids}</div>`:""}
              </div>`;}).join("")}</div>
          </div>`).join("")}</div>
        ${legacyNote}
      </div>
      <div style="display:flex;gap:12px;margin-top:14px">
        <div class="field" style="flex:1"><label class="label">Phone</label><input class="input" id="vPhone" value="${escA(v.phone||"")}"></div>
        <div class="field" style="flex:1"><label class="label">Email</label><input class="input" id="vEmail" value="${escA(v.email||"")}"></div></div>
      <div class="field" style="margin-top:14px"><label class="label">Service area <span style="font-weight:400;color:var(--ink-dim)">(leave blank = available everywhere)</span></label>
        <div style="display:flex;gap:10px">
          <input class="input" id="vZip" style="flex:1" inputmode="numeric" maxlength="5" placeholder="Home ZIP" value="${escA(v.svcZip||"")}">
          <input class="input" id="vRadius" style="width:120px" type="number" min="1" step="1" placeholder="Miles" value="${escA(v.svcRadius||"")}">
        </div>
        <div class="uz-h mono" id="vGeoNote" style="margin-top:5px;color:var(--ink-dim)">${v.svcPlace?esc(v.svcPlace)+" · "+esc(String(v.svcRadius||""))+" mi radius":"They'll only be offered for stores inside this radius."}</div>
        <input type="hidden" id="vLat" value="${escA(v.svcLat||"")}"><input type="hidden" id="vLng" value="${escA(v.svcLng||"")}">
      </div>
      <div class="field" style="margin-top:14px"><label class="label">Notes <span style="font-weight:400;color:var(--ink-dim)">(specialties, rates, hours, who to ask for…)</span></label>
        <textarea class="input" id="vNotes" rows="4" placeholder="e.g. Walk-in cooler specialists. Ask for Danny. No weekend calls. $95/hr after 5pm.">${esc(v.notes||"")}</textarea></div>
    </div>
    <div class="sheet-foot"><button class="btn btn-ghost" style="flex:1" onclick="openVendors()">Cancel</button>
      <button class="btn btn-primary" style="flex:1" id="vSave" onclick="saveVendor('${id||""}')">${id?"Save":"Add vendor"}</button></div>`);
}
async function saveVendor(id){
  const name=$("vName").value.trim();if(!name){toast("Vendor name is required","err");return}
  const cats=[...document.querySelectorAll("#vCats input:checked")].map(c=>c.value);
  // cats may hold category keys (whole area) and/or subcategory keys (granular)
  if(!cats.length){toast("Pick at least one category","err");return}
  const vid=id||uid();
  const zip=($("vZip").value||"").trim();
  const radius=parseFloat($("vRadius").value)||0;
  let svcLat=parseFloat($("vLat").value), svcLng=parseFloat($("vLng").value), svcPlace=(id&&VENDORS[id])?VENDORS[id].svcPlace||"":"";
  if(zip&&radius>0){
    const prev=id?VENDORS[id]:null;
    if(!prev||prev.svcZip!==zip||!isFinite(svcLat)){
      try{const g=await geocodeZip(zip);svcLat=g.lat;svcLng=g.lng;svcPlace=g.place;}
      catch(e){toast(e.message||"Couldn't look up that ZIP","err");return}
    }
  }else{svcLat=NaN;svcLng=NaN;svcPlace="";}
  const rec={id:vid,name,categories:cats,
    svcZip:(zip&&radius>0)?zip:"", svcRadius:(zip&&radius>0)?radius:"",
    svcLat:isFinite(svcLat)?svcLat:"", svcLng:isFinite(svcLng)?svcLng:"", svcPlace,
             category:cats.map(k=>CATEGORIES[k]||k).join(" · "),   // readable mirror for legacy readers
             phone:$("vPhone").value.trim(),email:$("vEmail").value.trim(),
             notes:$("vNotes").value.trim(),updatedAt:now()};
  const prev=id?VENDORS[id]:null;
  /* Optimistic save. Vendors are edited rarely, so this API endpoint is almost
     always cold-starting (Vercel boots the Firebase SDK first) — awaiting it
     made the form sit frozen for seconds. Show the result now, write in the
     background, and roll back only if the write actually fails. */
  VENDORS[vid]=rec; VENDOR_ECHO[vid]=rec;
  toast(id?"Vendor updated":"Vendor added");
  openVendors();
  apiWrite(`${VENDORS_NODE}/${vid}`,rec)
    .then(()=>refreshInBackground())
    .catch(e=>{
      if(prev){VENDORS[vid]=prev;VENDOR_ECHO[vid]=prev;}
      else{delete VENDORS[vid];delete VENDOR_ECHO[vid];}
      toast((e.message||"Could not save vendor")+" — not saved","err");
      if($("vendorRows"))openVendors();
    });
}
async function removeVendor(id){
  if(!confirm("Remove this third-party tech? Their tickets will fall back to the store's tech."))return;
  const prev=VENDORS[id];
  delete VENDORS[id]; VENDOR_ECHO[id]={__deleted:true,updatedAt:now()};
  toast("Vendor removed");
  openVendors();
  apiWrite(`${VENDORS_NODE}/${id}`,null)
    .then(()=>refreshInBackground())
    .catch(e=>{
      if(prev){VENDORS[id]=prev;VENDOR_ECHO[id]=prev;}
      toast((e.message||"Could not remove vendor")+" — not removed","err");
      if($("vendorRows"))openVendors();
    });
}

/* ============================================================ REFERENCE TAG SYSTEM
   Always-on corner badges (o/d/a/r/m + number) for pointing at controls.
   STABLE numbering: each logical element gets a number from its signature
   (tag + trimmed text + onclick), stored in a registry per role, so a given
   control keeps the same tag no matter how many tickets are on screen.
   Data-dependent, movable elements (ticket cards and their children, store
   groups, comments, activity, photos) are SKIPPED so numbers never drift.
   Default OFF; toggle with the # button in the top bar.
   ============================================================ */
let tagRegistry={};   // role -> { signature -> number }
let tagCounter={};    // role -> next number
function sigOf(el){
  const tag=el.tagName.toLowerCase();
  const oc=(el.getAttribute&&el.getAttribute("onclick")||"").replace(/['"][^'"]*['"]/g,"·").slice(0,40);
  const id=el.id?("#"+el.id):"";
  let txt=(el.getAttribute&&el.getAttribute("data-label"))||"";
  if(!txt){ // first text node only, trimmed, capped — stable-ish label
    txt=([...el.childNodes].find(n=>n.nodeType===3)?.textContent||"").trim().slice(0,24);
  }
  return `${tag}|${id}|${txt}|${oc}`;
}
// elements whose subtree we never tag (data-driven / movable)
function isSkippable(el){
  return el.classList&&(
    el.classList.contains("store-group")||  // store accordion (varies with stores)
    el.classList.contains("cmt")||          // a comment
    el.classList.contains("tl-item")||      // activity row
    el.classList.contains("photo-grid")||   // photos
    el.classList.contains("thumb-grid")||   // lazy photo thumbnails
    el.classList.contains("tk-photos")||
    el.classList.contains("preview-strip")||
    el.classList.contains("reftag")
  );
}
function applyTags(){
  if(!SESSION) return;
  document.querySelectorAll(".reftag").forEach(n=>n.remove());
  document.querySelectorAll("[data-reftagged]").forEach(n=>n.removeAttribute("data-reftagged"));
  if(!SHOW_REF_TAGS){document.body.classList.add("no-reftags");return}
  document.body.classList.remove("no-reftags");
  const role=SESSION.role, prefix=ROLE_PREFIX[role]||"x";
  if(!tagRegistry[role]){tagRegistry[role]={};tagCounter[role]=0}
  const reg=tagRegistry[role];
  let firstTicketTagged=false; // only the first ticket card gets numbered, for reference
  const roots=[$("topbar"),$("mainView")];
  const ov=$("modalOverlay"); if(ov&&ov.classList.contains("on"))roots.push(ov);
  roots.forEach(root=>{if(root)walk(root)});
  function visible(el){
    if(!(el instanceof HTMLElement))return false;
    if(el.classList&&el.classList.contains("reftag"))return false;
    const r=el.getBoundingClientRect();
    if(r.width<6||r.height<6)return false;
    const cs=getComputedStyle(el);
    if(cs.display==="none"||cs.visibility==="hidden"||cs.opacity==="0")return false;
    return true;
  }
  function tagEl(child,sigKey){
    let num=reg[sigKey];
    if(num===undefined){num=++tagCounter[role];reg[sigKey]=num}
    child.setAttribute("data-reftagged","");
    const tag=document.createElement("span");
    tag.className="reftag";tag.textContent=prefix+num;
    child.appendChild(tag);
  }
  function walk(el){
    [...el.children].forEach(child=>{
      const isTicket=child.classList&&child.classList.contains("tk");
      if(isTicket){
        // tag only the FIRST ticket card so it can be referenced; skip the rest
        if(firstTicketTagged)return;
        firstTicketTagged=true;
        if(visible(child)){tagEl(child,"tk-first");}
        // walk its children with ticket-relative stable keys
        walkTicket(child);
        return;
      }
      if(isSkippable(child))return;
      if(visible(child))tagEl(child,sigOf(child));
      if(child.children&&child.children.length)walk(child);
    });
  }
  // inside the first ticket, key children by class so numbers stay stable
  function walkTicket(el){
    [...el.children].forEach(child=>{
      if(child.classList&&child.classList.contains("reftag"))return;
      if(child.classList&&(child.classList.contains("tk-photos")))return;
      if(visible(child)){
        const cls=(child.className||"").split(" ")[0]||child.tagName.toLowerCase();
        tagEl(child,"tkpart:"+cls);
      }
      if(child.children&&child.children.length)walkTicket(child);
    });
  }
}
function toggleTags(){SHOW_REF_TAGS=!SHOW_REF_TAGS;applyTags();toast(SHOW_REF_TAGS?"Reference tags ON":"Reference tags OFF")}

(function init(){
  document.getElementById("appVersion").textContent="v"+APP_VERSION;
  ["emailIn","pwIn"].forEach(id=>document.getElementById(id).addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()}));
  window.addEventListener("resize",()=>{if(SESSION)applyTags()});
  tryRestoreSession(); // stay logged in across refresh
})();
</script>
