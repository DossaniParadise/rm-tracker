// Email opens a prefilled draft in the native mail client on BOTH desktop and
// mobile (mailto:). Text / Call use sms:/tel:, which only do anything useful on
// a phone, so they stay mobile-only.
function contactBtns(t,who){
  const msg=draftBody(t,who);
  const subj=`Ticket ${t.shortId} · ${storeName(t.storeId)}`;
  let b="";
  if(IS_MOBILE && who.phone){
    b+=`<a class="btn btn-ghost btn-sm" href="${escA(smsLink(who.phone,msg))}">✉ Text</a>`;
    b+=`<a class="btn btn-ghost btn-sm" href="${escA(telLink(who.phone))}">📞 Call</a>`;
  }
  if(who.email){
    const replyTo=SESSION.email;
    // To: vendor/tech + the store's director + area coach, so everyone
    // responsible is on the thread from the first email (deduped).
    const dir=storeDirector(t.storeId), coach=storeCoach(t.storeId);
    const to=[...new Set([who.email,dir&&dir.email,coach&&coach.email]
      .filter(Boolean).map(e=>String(e).trim().toLowerCase()))].join(",");
    b+=`<a class="btn btn-ghost btn-sm" href="${escA(mailtoLink(to,subj,msg+"\n\nReply to: "+replyTo,replyTo))}">@ Email</a>`;
  }
  if(!b){
    // No email on file, and on desktop there's nothing tappable to offer.
    b = who.phone
      ? `<span class="rb-none">${esc(fmtPhone(who.phone))} — call or text from your phone</span>`
      : `<span class="rb-none">No contact info on file</span>`;
  }
  return b;
}
// shared message body (vendor-friendly: store, issue, optional address, optional photos)
function draftBody(t,who){
  const addr=(store(t.storeId).address||"").trim();
  const photos=(t.photos||[]);
  const desc=(t.description||"").trim();
  let msg=`Hi ${who.name}, we have an issue at ${storeName(t.storeId)} that we need your help with.`;
  if(desc){ msg+=` ${desc}`; if(!/[.!?]$/.test(desc)) msg+="."; }
  if(addr) msg+=` The address for the store is ${addr}.`;
  if(photos.length){
    msg+=` Here ${photos.length===1?"is a photo":"are some photos"} for reference:\n`+photos.join("\n");
  }
  msg+=`${photos.length?"\n\n":" "}Please let me know when you can address this. Thank you.`;
  return msg;
}

// inline assign from a row (admin)
async function rowAssign(id){
  const sel=$("rsel_"+id); if(!sel||!sel.value){toast("Pick someone first","err");return}
  const val=sel.value; let patch,note;
  if(val.startsWith("tech:")){
    const tid=val.slice(5); const x=(MASTER.repairTechnicians||{})[tid];
    if(!x){toast("That tech no longer exists — left unassigned","err");return}

/* ============================================================ MODAL */
let activeModal=null;
function modal(html){
  let o=$("modalOverlay");
  if(!o){o=document.createElement("div");o.id="modalOverlay";o.className="overlay";document.body.appendChild(o);o.addEventListener("click",e=>{if(e.target===o)closeModal()})}
  // A closeModal() schedules a delayed content wipe (for the fade-out). If a
  // new modal opens before that timer fires, the wipe would erase it — cancel
  // any pending wipe so back-to-back close→open is always safe.
  if(o._wipeTimer){clearTimeout(o._wipeTimer);o._wipeTimer=null;}
  o.classList.remove("wide");o.classList.remove("tall");   // only the importer changes sheet size
  // Guarantee a close affordance: if the modal's own markup doesn't include an
  // X button, inject a floating one in the top-right that dismisses the modal.
  const hasOwnX = /class="x-btn"/.test(html);
  const autoX = hasOwnX ? "" : `<button class="x-btn x-float" aria-label="Close" onclick="closeModal()">✕</button>`;
  o.innerHTML=`<div class="sheet">${autoX}${html}</div>`;
  requestAnimationFrame(()=>{o.classList.add("on");applyTags()});
  activeModal=o;
}
function closeModal(){const o=$("modalOverlay");if(o){o.classList.remove("on");o._wipeTimer=setTimeout(()=>{if(o){o.innerHTML="";o._wipeTimer=null;}},220)}activeModal=null}

async function submitTicket(){

  const sub=needSub?(subEl.value||""):"";

/* Director assign — same integrity rules as Overwatch. */
/* Assign straight from a list/tile row. */
/* Options for a Director's assign dropdown.
   A <select> with no matching option silently falls back to displaying its
   FIRST option — which is why a ticket already with a third-party vendor was
   showing "— Unassigned —". Worse, pressing Assign then submitted "" and
   quietly removed that vendor. So when a vendor is on the ticket we include
   them as the selected option; applyDirectorAssign treats re-submitting the
   same vendor as a no-op, and Directors still can't pick a DIFFERENT one. */
function directorAssignOptions(t){
  const techs=storeTechIds(t.storeId).map(id=>[id,(MASTER.repairTechnicians||{})[id]]).filter(([,x])=>x);
  const vend=t.assignedVendorId?VENDORS[t.assignedVendorId]:null;
  const none=!t.assignedTechId&&!t.assignedVendorId;
  let html=`<option value=""${none?" selected":""}>— Unassigned —</option>`;
  if(t.assignedVendorId){
    const nm=vend?vend.name:"Third-party (removed)";
    html+=`<option value="vendor:${t.assignedVendorId}" selected>🏢 ${esc(nm)} — third-party</option>`;
  }
  html+=techs.map(([id,x])=>`<option value="tech:${id}"${t.assignedTechId===id?" selected":""}>🔧 ${esc(x.name)}</option>`).join("");
  return html;
}
/* Who last set this ticket's assignment, and when. Read from the activity
   trail so the warning can name the actual person rather than guessing. */
function lastAssignEvent(t){
  const acts=Array.isArray(t.activity)?t.activity:[];
  for(let i=acts.length-1;i>=0;i--){
    const a=acts[i];
    if(a.action==="assign"||(a.action==="status"&&(a.toStatus==="dispatched"||a.toStatus==="assigned")))
      return a;
  }
  return null;
}
function currentAssigneeName(t){
  if(t.assignedTechId){const x=(MASTER.repairTechnicians||{})[t.assignedTechId];return x?x.name:"a technician"}
  if(t.assignedVendorId){const v=VENDORS[t.assignedVendorId];return v?v.name:"a third-party tech"}
  return null;
}
/* Changing someone else's routing decision is confirmed, never silent. */
let _pendingAssign=null;
function confirmReassign(id,val,fromDetail){
  const t=TICKETS[id];
  const cur=currentAssigneeName(t);
  const ev=lastAssignEvent(t);
  const who=ev&&ev.by?ev.by:"Someone";
  const when=ev&&ev.ts?fmtDate(ev.ts):"earlier";
  const isVendor=!!t.assignedVendorId;
  _pendingAssign={id,val,fromDetail};
  modal(`<div class="sheet-head"><h2>Change this assignment?</h2><button class="x-btn" onclick="closeModal()">✕</button></div>
    <div class="sheet-body">

      <p style="color:var(--ink-mid);font-size:14px;margin:12px 0 0">Are you sure you want to change this assignment?</p>
      ${isVendor?`<p style="color:var(--ink-dim);font-size:12.5px;margin:10px 0 0">This job is with a third-party tech. Moving it in-house means ${esc(cur||"they")} will no longer be expected.</p>`:""}
    </div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" style="flex:1" onclick="cancelReassign()">Keep as is</button>

}
/* Cancelling must redraw, or the dropdown keeps showing the option the user
   picked even though nothing changed. */
function cancelReassign(){_pendingAssign=null;closeModal();render();}
async function proceedReassign(){
  const p=_pendingAssign; _pendingAssign=null; closeModal();
  if(p) await applyDirectorAssign(p.id,p.val,p.fromDetail,true);
}
async function rowDirectorAssign(id){
  const sel=$("dosel_"+id); if(!sel){toast("Pick someone first","err");return}
  await applyDirectorAssign(id,sel.value||"");
}
async function doDirectorAssign(id){
  await applyDirectorAssign(id,($("doAssign")||{}).value||"",true);
}
async function applyDirectorAssign(id,val,fromDetail,confirmed){
  const t0=TICKETS[id];
  // If this ticket is already assigned and the change wasn't made by whoever
  // set it, confirm first — naming who assigned it and when.
  if(!confirmed && t0 && (t0.assignedTechId||t0.assignedVendorId)){
    const same=(val==="tech:"+t0.assignedTechId)||(val==="vendor:"+t0.assignedVendorId);
    if(!same){const ev=lastAssignEvent(t0);
      if(!ev||ev.by!==SESSION.name){confirmReassign(id,val,fromDetail);return}}
  }
  let patch,note;
  if(!val){
    // Blank = put it back in the pool.
    if(await patchTicket(id,{assignedTechId:null,assignedVendorId:null,status:"unassigned"},
        {action:"assign",note:"unassigned (pool)",toStatus:"unassigned"}))
      {toast("Back to unassigned");if(fromDetail)openTicket(id)}
    return;
  }
  if(val.startsWith("tech:")){
    const tid=val.slice(5), x=(MASTER.repairTechnicians||{})[tid];
    if(!x){toast("That tech no longer exists","err");return}
    patch={assignedTechId:tid,assignedVendorId:null,status:"dispatched",dispatchedAt:now()};note="🔧 "+x.name;
  }else{
    const vid=val.slice(7);
    if(vid===TICKETS[id].assignedVendorId){toast("No change");return}   // unchanged
    // Directors cannot route TO a third-party vendor — Overwatch only.
    toast("Vendor assignment is handled by Overwatch","err");return;
  }
  if(await patchTicket(id,patch,{action:"assign",note,toStatus:patch.status}))
    toast((patch.status==="dispatched"?"Dispatched · ":"Assigned · ")+note);
}
/* DM asks for an outside vendor: stays unassigned so Overwatch chooses who. */
async function requestThirdParty(id){
  if(await patchTicket(id,{status:"unassigned",assignedTechId:null,assignedVendorId:null},
      {action:"status",toStatus:"unassigned",note:"Third-party tech requested by "+SESSION.name}))
    {toast("Flagged for Overwatch");openTicket(id)}
}
async function dispatchToStoreTech(id,techId,confirmed){
  const t0=TICKETS[id];
  if(!confirmed && t0 && (t0.assignedTechId||t0.assignedVendorId) && t0.assignedTechId!==techId){
    const ev=lastAssignEvent(t0);
    if(!ev||ev.by!==SESSION.name){confirmReassign(id,"tech:"+techId,false);return}
  }
  return _doDispatchToStoreTech(id,techId);
}
async function _doDispatchToStoreTech(id,techId){
  const tech=(MASTER.repairTechnicians||{})[techId];

  const btn=$("reqTechBtn");if(btn){btn.disabled=true;btn.innerHTML='<span class="inline-spin"></span>'}

      {action:"status",toStatus:"dispatched",note:"Coach requested "+tech.name})){
    toast("Dispatched to "+tech.name);closeModal();render();
  }else if(btn){btn.disabled=false;btn.textContent="Yes, request tech"}
}

/* ---- comment photos ----

let cmtPhotos=[];
async function addCommentPhotos(input){
  const files=[...input.files].slice(0,5-cmtPhotos.length);input.value="";
  for(const f of files){
    if(f.size>25*1024*1024){toast("That photo is very large and was skipped","err");continue}
    const ph={file:f,localUrl:URL.createObjectURL(f),url:null,uploading:true,failed:false};

async function uploadOneCmt(ph){
  ph.uploading=true;ph.failed=false;renderCmtPreview();

  catch(e){ph.uploading=false;ph.failed=true;toast("Photo upload failed: "+(e.message||"network error")+" — tap retry","err");}

/* ---- who can do what (new lifecycle) ----

function hasStoreAccess(){return ["manager","coach","director","admin"].includes(SESSION.role)}
function ticketControls(t){

      const isCur=t.status===target;

      }
      h+=`<button class="btn btn-ghost btn-block" onclick="requestThirdParty('${t._id}')">🏢 Leave unassigned — needs a third-party</button>

    if(canEditContent())
      h+=`<button class="btn btn-ghost btn-block" style="margin-top:14px" onclick="openEdit('${t._id}')">✎ ${role==="director"?"Edit all details":"Edit details &amp; urgency"}</button>`;
    return h;

function statusGrid(t,targets){

function assignControls(t){

  const techIds=[...new Set([...storeTechIds(t.storeId),t.assignedTechId].filter(Boolean))];
  const techs=techIds.map(id=>[id,(MASTER.repairTechnicians||{})[id]]).filter(([,v])=>v);
  const techOpts=techs.map(([id,v])=>`<option value="tech:${id}"${t.assignedTechId===id?" selected":""}>🔧 ${esc(v.name)}</option>`).join("");

      ${rest.length?`<optgroup label="${match.length?"All other vendors":"Third-party vendors"}">${rest.map(vOpt).join("")}</optgroup>`:""}
      ${!match.length&&!rest.length?`<optgroup label="Third-party vendors"><option disabled>No vendors added</option></optgroup>`:""}

// Refresh without blocking the click that triggered it. Skips repainting over

function refreshInBackground(){

async function patchTicket(id,patch,activityEntry){
  const t=TICKETS[id];if(!t){toast("Ticket not found","err");return}
  const activity=Array.isArray(t.activity)?t.activity.slice():[];
  if(activityEntry)activity.push({ts:now(),by:SESSION.name,role:SESSION.role,...activityEntry});
  const updated={...t,...patch,activity,updatedAt:now()};
  showLoader(true);
  try{
    await apiWrite(`${TICKETS_NODE}/${id}`,updated);
    // Keep the lazy closed-cache coherent (Closed tab must be instantly right).
    if(updated.status==="closed")CLOSED_TICKETS[id]=updated;
    else delete CLOSED_TICKETS[id];
    // Echo the write locally so the UI reflects it IMMEDIATELY — the CDN copy
    // of the master can lag ~60s, and waiting on it made every click feel dead.
    TICKETS[id]=updated; LOCAL_ECHO[id]=updated;
    showLoader(false); render(); refreshInBackground(); return true
  }
  catch(e){showLoader(false);toast(e.message||"Update failed","err");return false}
}
async function setStatus(id,status){
  if(TICKETS[id].status===status){toast("Already in that status");return}
  // Integrity: a ticket can only be "assigned" or "dispatched" if a real person
  // (tech or vendor) is attached. Otherwise it can't hold those statuses.
  if((status==="assigned"||status==="dispatched") && !ticketAssignee(TICKETS[id])){
    toast("Assign a person first — left unassigned","err");return;
  }
  if(await patchTicket(id,{status},{action:"status",toStatus:status})){toast(`Status → ${STATUSES[status].label}`);openTicket(id)}
}
/* Close is destructive (removes the ticket from every view except Overwatch),

async function doAssign(id){
  const val=$("assignSel").value;
  let patch,note;
  if(val.startsWith("tech:")){
    const tid=val.slice(5); const x=(MASTER.repairTechnicians||{})[tid];
    if(!x){toast("That tech no longer exists — left unassigned","err");return}
    // In-house techs see dispatched jobs in their own app, so there is nobody to
    // phone first — skip "assigned" and dispatch immediately. Vendors still go
    // to "assigned" because someone has to actually contact them.
    patch={assignedTechId:tid,assignedVendorId:null,status:"dispatched",dispatchedAt:now()};note="🔧 "+x.name;
  }
  else if(val.startsWith("vendor:")){
    const vid=val.slice(7); const v=VENDORS[vid];
    if(!v){toast("That vendor no longer exists — left unassigned","err");return}
    patch={assignedVendorId:vid,assignedTechId:null,status:"assigned"};note="🏢 "+v.name;
  }
  else{patch={assignedVendorId:null,assignedTechId:null,status:"unassigned"};note="unassigned (pool)"}
  if(await patchTicket(id,patch,{action:"assign",note,toStatus:patch.status})){toast(patch.status==="dispatched"?"Dispatched · "+note:"Assignment updated");openTicket(id)}
}
async function techClockIn(id){

}
/* ---- one-job-in-progress rule (techs) ----
   A tech can only have a single ticket "in progress" at a time. If they try to
   start a second one while another is still running, we stop and ask whether
   they already finished the other job. Saying yes runs the finish-photo flow on
   the OTHER job first, then starts THIS one. Saying no just cancels. */
function otherInProgress(exceptId){
  if(!SESSION||SESSION.role!=="tech")return null;
  for(const k of Object.keys(TICKETS)){
    const t=TICKETS[k];
    if(k===exceptId || t.status!=="in_progress") continue;
    if(t.assignedTechId===SESSION.refId) return {_id:k,...t};
  }
  return null;
}
function techStart(id){
  const other=otherInProgress(id);
  if(!other){doTechStart(id);return}
  const desc=other.description?other.description.slice(0,60)+(other.description.length>60?"…":""):"the other job";
  modal(`<div class="sheet-head"><h2>Finish the other job first?</h2><button class="x-btn" onclick="openTicket('${id}')">✕</button></div>
    <div class="sheet-body">
      <p style="margin:0 0 6px;color:var(--ink-mid);font-size:14px">You already have a job in progress:</p>
      <div class="other-job">
        <div class="oj-store">${esc(storeName(other.storeId))}</div>
        <div class="oj-desc">${esc(desc)}</div>
        <div class="oj-meta mono">⏱ ${elapsedHM(other.clockInAt)}</div>
      </div>
      <p style="margin:14px 0 0;color:var(--ink-mid);font-size:14px">Did you already finish it? We'll get a quick photo, mark it finished, then start this one.</p>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" style="flex:1" onclick="openTicket('${id}')">Not yet</button>
      <button class="btn btn-primary" style="flex:1" onclick="openFinish('${other._id}',{thenStart:'${id}'})">Yes, finish it</button>
    </div>`);
}
async function doTechStart(id){
  if(TICKETS[id].status==="in_progress"){toast("Already in progress");return}
  const t=TICKETS[id];const patch={status:"in_progress"};
  if(!t.clockInAt)patch.clockInAt=now();
  if(await patchTicket(id,patch,{action:"clockin",toStatus:"in_progress"})){toast("In progress");openTicket(id)}
}
async function techFinish(id){
  if(await patchTicket(id,{status:"finished",finishedAt:now(),clockOutAt:now()},{action:"clockout",toStatus:"finished"})){toast("Clocked out · finished");openTicket(id)}
}

/* ---- finish with a required photo (mobile-first) ----

let finishPhotos=[];

async function addFinishPhotos(id,input){
  const files=[...input.files].slice(0,5-finishPhotos.length);input.value="";
  for(const f of files){
    if(f.size>25*1024*1024){toast("That photo is very large and was skipped","err");continue}
    const ph={file:f,localUrl:URL.createObjectURL(f),url:null,uploading:true,failed:false};
    finishPhotos.push(ph);renderFinishPreview();
    await uploadOneFinish(ph);
  }
}
async function uploadOneFinish(ph){
  ph.uploading=true;ph.failed=false;renderFinishPreview();
  try{ph.url=await uploadPhoto(ph.file);ph.uploading=false;}
  catch(e){ph.uploading=false;ph.failed=true;toast("Photo upload failed: "+(e.message||"network error")+" — tap retry","err");}
  renderFinishPreview();
}
function retryFinishPhoto(i){const ph=finishPhotos[i];if(ph)uploadOneFinish(ph);}
function renderFinishPreview(){
  const el=$("finPreview");if(!el)return;
  el.innerHTML=finishPhotos.map((p,i)=>`<div class="pv${p.failed?" pv-failed":""}">
      <img src="${p.localUrl}" alt="">
      ${p.uploading?`<span class="pv-spin"><span class="inline-spin"></span></span>`:""}
      ${p.failed?`<button class="pv-retry" onclick="retryFinishPhoto(${i})">↻ Retry</button>`:""}
      <button class="pv-x" onclick="finishPhotos.splice(${i},1);renderFinishPreview()">✕</button>
    </div>`).join("");
  // Photo is optional: only block the button while an upload is in flight.
  const anyUploading=finishPhotos.some(p=>p.uploading);
  const btn=$("finConfirm");if(btn)btn.disabled=anyUploading;
  applyTags();
}
async function confirmFinish(id){
  const urls=finishPhotos.filter(p=>p.url).map(p=>p.url);
  if(!urls.length){
    // No photo: remind once, but let them proceed if they insist.
    modal(`<div class="sheet-head"><h2>Finish without a photo?</h2><button class="x-btn" onclick="openFinish('${id}'${finishThenStart?`,{thenStart:'${finishThenStart}'}`:""})">✕</button></div>
      <div class="sheet-body"><p style="font-size:14px;color:var(--ink-mid);margin:0">A photo of the completed work is recommended. Are you sure you want to mark this finished without one?</p></div>
      <div class="sheet-foot">
        <button class="btn btn-ghost" style="flex:1" onclick="openFinish('${id}'${finishThenStart?`,{thenStart:'${finishThenStart}'}`:""})">Add a photo</button>
        <button class="btn btn-primary fin" style="flex:1" onclick="finalizeFinish('${id}')">Finish anyway</button>
      </div>`);
    return;
  }
  finalizeFinish(id);
}
async function finalizeFinish(id){
  const urls=finishPhotos.filter(p=>p.url).map(p=>p.url);
  const btn=$("finConfirm");if(btn){btn.disabled=true;btn.innerHTML='<span class="inline-spin"></span> Finishing…'}
  // Optional — an empty box finishes exactly as before.
  const note=(($("finNote")||{}).value||"").trim();
  const t=TICKETS[id];const photos=(t&&Array.isArray(t.photos)?t.photos.slice():[]).concat(urls);
  const patch={status:"finished",finishedAt:now(),photos};
  if(t&&t.clockInAt&&!t.clockOutAt)patch.clockOutAt=now();
  let noteTxt = urls.length ? `Finished with ${urls.length} photo${urls.length>1?"s":""}` : "Finished (no photo)";
  if(note){
    noteTxt = note;
    patch.closeNote={text:note,by:SESSION.name,at:now()};
  }
  if(await patchTicket(id,patch,{action:"clockout",toStatus:"finished",note:noteTxt})){
    finishPhotos=[];
    const next=finishThenStart;finishThenStart=null;
    if(next){toast("Finished · starting next job");doTechStart(next);}
    else{toast(urls.length?"Finished · photo added":"Finished");openTicket(id);}
  }else if(btn){btn.disabled=false;btn.innerHTML="✓ Mark finished"}
}

function renderEditPreview(){const el=$("ePreview");if(!el)return;
  el.innerHTML=editPhotos.map((u,i)=>`<div class="pv"><img src="${escA(u)}" alt=""><button class="pv-x" onclick="editPhotos.splice(${i},1);renderEditPreview()">✕</button></div>`).join("");applyTags()}
async function addEditPhotos(input){

/* ============================================================ TECH DAY REPORT (overwatch)
   Pick a tech + a date → every action that tech took that day (comments, status
   changes, finishes, in-progress, waiting), across all tickets, in time order,
   plus an interactive map of where they were: job-site store locations and the
   day's location pings, connected in time order so you can see the route and the
   distances between stops. */
let _reportTech="", _reportDate="";
function ymdLocal(ts){const d=new Date(ts);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function todayYmd(){return ymdLocal(now());}
function dayBounds(ymd){
  const [y,m,d]=ymd.split("-").map(Number);
  const start=new Date(y,m-1,d,0,0,0,0).getTime();
  const end=new Date(y,m-1,d,23,59,59,999).getTime();
  return [start,end];
}
function fmtClock(ts){return new Date(ts).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});}

function openTechReport(){

// Gather a tech's actions for a day. Actions are matched by name+tech role,
// since ticket logs stamp the actor name and role (not an id).
function gatherTechDay(techId,ymd){
  const tech=(MASTER.repairTechnicians||{})[techId];
  if(!tech)return null;
  const name=tech.name;
  const [start,end]=dayBounds(ymd);
  const events=[];
  Object.keys(TICKETS).forEach(tid=>{
    const t=TICKETS[tid];
    (Array.isArray(t.activity)?t.activity:[]).forEach(a=>{
      if(a.role==="tech" && a.by===name && a.ts>=start && a.ts<=end)
        events.push({ts:a.ts,kind:"action",action:a.action,toStatus:a.toStatus,note:a.note||"",ticketId:tid,storeId:t.storeId});
    });
    (Array.isArray(t.comments)?t.comments:[]).forEach(c=>{
      if(c.role==="tech" && c.by===name && c.ts>=start && c.ts<=end)
        events.push({ts:c.ts,kind:"comment",text:c.text||"",ticketId:tid,storeId:t.storeId});
    });
  });
  events.sort((a,b)=>a.ts-b.ts);
  // location pings for that day
  const rec=((MASTER.admins||{}).techLocations||{})[techId];
  const pings=(rec&&Array.isArray(rec.pings)?rec.pings:[]).filter(p=>p.ts>=start&&p.ts<=end).sort((a,b)=>a.ts-b.ts);
  return {tech,name,events,pings};
}

function actionLabel(e){
  if(e.kind==="comment")return `💬 Commented`;
  const map={clockin:"▶ Started (in progress)",clockout:"✓ Marked finished",status:e.toStatus?`→ ${(STATUSES[e.toStatus]||{}).label||e.toStatus}`:"Status change",created:"Created",assign:"Assigned",edit:"Edited"};
  return map[e.action]||e.action||"Action";
}

function runTechReport(){
  const techId=$("rTech").value, ymd=$("rDate").value;
  const out=$("reportOut");
  if(!techId){out.innerHTML=`<div class="rp-empty">Choose a technician above.</div>`;return}
  _reportTech=techId;_reportDate=ymd;
  const data=gatherTechDay(techId,ymd);
  if(!data){out.innerHTML=`<div class="rp-empty">Tech not found.</div>`;return}
  const {name,events,pings}=data;
  const dateLabel=new Date(dayBounds(ymd)[0]).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});

  // Build map stops: unique job-site stores touched (in first-touch time order)
  // plus location pings. Distance is summed along the store route in time order.
  const storeSeq=[];const seen={};
  events.forEach(e=>{const c=storeCoords(e.storeId);if(c&&!seen[e.storeId]){seen[e.storeId]=true;storeSeq.push({storeId:e.storeId,...c,firstTs:e.ts});}});
  let drove=0;
  for(let i=1;i<storeSeq.length;i++)drove+=distanceMiles(storeSeq[i-1],storeSeq[i])||0;

  const finishedN=events.filter(e=>e.action==="clockout").length;
  const startedN=events.filter(e=>e.action==="clockin").length;
  const commentN=events.filter(e=>e.kind==="comment").length;

  const summary=`<div class="rp-summary">
    <div class="rp-stat"><div class="rp-n">${events.length}</div><div class="rp-l">actions</div></div>
    <div class="rp-stat"><div class="rp-n">${finishedN}</div><div class="rp-l">finished</div></div>
    <div class="rp-stat"><div class="rp-n">${startedN}</div><div class="rp-l">started</div></div>
    <div class="rp-stat"><div class="rp-n">${storeSeq.length}</div><div class="rp-l">stores</div></div>
    <div class="rp-stat"><div class="rp-n">~${drove<10?drove.toFixed(1):Math.round(drove)}</div><div class="rp-l">mi between stops</div></div>
  </div>`;

  const map=reportMap(storeSeq,pings);

  const timeline = events.length
    ? `<div class="rp-timeline">`+events.map(e=>{
        const gps=storeGeoUrl(e.storeId);
        return `<div class="rp-row" ${gps?`onclick="window.open('${escA(gps)}','_blank')" style="cursor:pointer"`:""}>
          <div class="rp-time mono">${fmtClock(e.ts)}</div>
          <div class="rp-body">
            <div class="rp-act">${actionLabel(e)}</div>
            <div class="rp-store">${esc(storeName(e.storeId))}</div>
            ${e.kind==="comment"?`<div class="rp-note">"${esc(e.text)}"</div>`:(e.note?`<div class="rp-note">${esc(e.note)}</div>`:"")}
          </div>
        </div>`;}).join("")+`</div>`
    : `<div class="rp-empty">No tracked actions by ${esc(name)} on this day.</div>`;

  out.innerHTML=`
    <div class="rp-head">${esc(name)} · ${esc(dateLabel)}</div>
    ${summary}
    ${map}
    <div class="section-label" style="margin-top:20px">Timeline<span class="ln"></span></div>
    ${timeline}`;
}

// Interactive SVG map: normalizes lat/lng of all points into the viewbox, draws
// the store route in time order (so you can see the path driven), plots pings as
// small dots, and makes each store stop clickable to open in Google Maps.
function reportMap(storeSeq,pings){
  const pts=[...storeSeq.map(s=>({...s,type:"store"})),...pings.map(p=>({...p,type:"ping"}))];
  if(!pts.length)return `<div class="rp-empty">No mapped locations for this day (stores may be missing coordinates, and no location pings were recorded).</div>`;
  const lats=pts.map(p=>p.lat),lngs=pts.map(p=>p.lng);
  let minLat=Math.min(...lats),maxLat=Math.max(...lats),minLng=Math.min(...lngs),maxLng=Math.max(...lngs);
  // pad so single-point or tight clusters aren't on the edge
  const padLat=Math.max((maxLat-minLat)*0.15,0.01), padLng=Math.max((maxLng-minLng)*0.15,0.01);
  minLat-=padLat;maxLat+=padLat;minLng-=padLng;maxLng+=padLng;
  const W=600,H=360;
  const X=lng=>((lng-minLng)/(maxLng-minLng||1))*W;
  const Y=lat=>H-((lat-minLat)/(maxLat-minLat||1))*H; // invert: north up
  // route line through stores in order
  let path="";
  storeSeq.forEach((s,i)=>{path+=(i?" L":"M")+X(s.lng).toFixed(1)+" "+Y(s.lat).toFixed(1);});
  const routeLine=storeSeq.length>1?`<path d="${path}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.8"/>`:"";
  const pingDots=pings.map(p=>`<circle cx="${X(p.lng).toFixed(1)}" cy="${Y(p.lat).toFixed(1)}" r="4" fill="var(--blue)" opacity="0.55"/>`).join("");
  const storeDots=storeSeq.map((s,i)=>{
    const gps=storeGeoUrl(s.storeId);
    return `<g class="rp-stop" onclick="window.open('${escA(gps)}','_blank')" style="cursor:pointer">
      <circle cx="${X(s.lng).toFixed(1)}" cy="${Y(s.lat).toFixed(1)}" r="11" fill="var(--amber-deep)"/>
      <text x="${X(s.lng).toFixed(1)}" y="${(Y(s.lat)+4).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">${i+1}</text>
      <title>${esc(storeName(s.storeId))} — tap to open in maps</title>
    </g>`;}).join("");
  const legend=`<div class="rp-legend"><span><i class="lg-store"></i> Job stop (numbered by order)</span><span><i class="lg-ping"></i> Location ping</span>${storeSeq.length>1?'<span><i class="lg-route"></i> Route</span>':""}</div>`;
  return `<div class="rp-map-wrap">
    <svg viewBox="0 0 ${W} ${H}" class="rp-map" preserveAspectRatio="xMidYMid meet">
      <rect x="0" y="0" width="${W}" height="${H}" fill="var(--panel-2)"/>
      ${routeLine}${pingDots}${storeDots}
    </svg>${legend}</div>`;
}

/* ============================================================ OVERWATCH MAP
   Minimalist, dependency-free store map. Each store is a dot positioned by its
   real lat/lng (normalised into the viewbox), coloured by the repair tech who
   covers it, labelled with its OPEN ticket count. Tapping a dot jumps to that
   store's ticket list. Stores without coordinates are listed underneath so they
   are never silently dropped. */
let __owBubbleUid=0;
/* One bubble per store. A store covered by several techs is split into equal
   colour bands (half/half for two) rather than being attributed to just the
   first tech — that merge is what made FixMi show fewer techs than FindMi. */
function owBubble(x,y,r,cols,open){
  const stroke=open?1.8:1, op=open?0.95:0.32;
  if(cols.length<=1){
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${cols[0]||NO_TECH_COLOR}" fill-opacity="${op}" stroke="#fff" stroke-width="${stroke}"/>`;
  }
  const id="owb"+(++__owBubbleUid), w=(2*r)/cols.length;
  const bands=cols.map((c,i)=>
    `<rect x="${(+x-r+i*w).toFixed(2)}" y="${(+y-r).toFixed(2)}" width="${(w+0.05).toFixed(2)}" height="${(2*r).toFixed(2)}" fill="${c}" fill-opacity="${op}"/>`).join("");
  return `<defs><clipPath id="${id}"><circle cx="${x}" cy="${y}" r="${r}"/></clipPath></defs>`+
         `<g clip-path="url(#${id})">${bands}</g>`+
         `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#fff" stroke-width="${stroke}"/>`;
}
function renderZoneMap(){
  const zones=techZones();
  // Overwatch sees every store; everyone else only their own scope. Techs see
  // the stores they actually have work at.
  let ids;
  if(SESSION.role==="admin") ids=Object.keys(RESTAURANTS);
  else if(SESSION.role==="tech")
    ids=[...new Set(Object.values(TICKETS).filter(t=>t.assignedTechId===SESSION.refId
        &&TECH_VISIBLE_STATUSES.includes(t.status)).map(t=>t.storeId))];
  else ids=myStoreIds();
  const openCount=sid=>ticketsForStore(sid).filter(t=>ACTIVE_STATUSES.includes(t.status)).length;

  const mapped=[],unmapped=[];
  ids.forEach(sid=>{
    const c=storeCoords(sid);
    // On a tech's own map every dot is their own dispatched work, so colour it
    // as theirs. Painting it with all the store's techs made Kyle's jobs look
    // like Gino's. Overwatch keeps the split-colour zone view.
    const tids=(SESSION.role==="tech")?[SESSION.refId]:storeTechIds(sid);
    const cols=tids.length?tids.map(id=>(zones[id]||{}).color||NO_TECH_COLOR):[NO_TECH_COLOR];
    const names=tids.length?tids.map(id=>(zones[id]||{}).name||"Unknown tech"):["No tech assigned"];
    const rec={sid,open:openCount(sid),tids,cols,techName:names.join(" + ")};
    (c?mapped:unmapped).push(c?{...rec,...c}:rec);
  });

  const totalOpen=ids.reduce((n,sid)=>n+openCount(sid),0);

  /* Legend covers EVERY technician in the directory — including any with no
     stores yet — so the roster here always matches FindMi. A shared store is
     counted under each tech that covers it. */
  const groups={};
  Object.entries(zones).forEach(([id,z])=>{groups[id]={name:z.name,color:z.color,stores:0,open:0}});
  [...mapped,...unmapped].forEach(r=>{
    const keys=r.tids.length?r.tids:["__none"];
    keys.forEach(k=>{
      if(!groups[k])groups[k]={name:k==="__none"?"No tech assigned":"Unknown tech",color:NO_TECH_COLOR,stores:0,open:0};
      groups[k].stores++;groups[k].open+=r.open;
    });
  });
  const legend=Object.entries(groups)
    .sort((a,b)=>b[1].open-a[1].open||b[1].stores-a[1].stores||a[1].name.localeCompare(b[1].name))
    .map(([k,g])=>`<div class="ow-leg-row">
      <i style="background:${g.color}"></i>
      <span class="ow-leg-name">${esc(g.name)}</span>
      <span class="ow-leg-n">${g.open} open</span>
      <span class="ow-leg-s">${g.stores} store${g.stores===1?"":"s"}</span>
    </div>`).join("");
  const techCount=Object.keys(zones).length;

  let svg=`<div class="rp-empty">No store coordinates available to map.</div>`;
  if(mapped.length){
    const lats=mapped.map(p=>p.lat),lngs=mapped.map(p=>p.lng);
    let minLat=Math.min(...lats),maxLat=Math.max(...lats),minLng=Math.min(...lngs),maxLng=Math.max(...lngs);
    const padLat=Math.max((maxLat-minLat)*0.12,0.05),padLng=Math.max((maxLng-minLng)*0.12,0.05);
    minLat-=padLat;maxLat+=padLat;minLng-=padLng;maxLng+=padLng;
    const W=760,H=520;
    const X=l=>((l-minLng)/(maxLng-minLng||1))*W, Y=l=>H-((l-minLat)/(maxLat-minLat||1))*H;
    const R_ACTIVE=13, R_IDLE=5;
    const dots=mapped.slice().sort((a,b)=>a.open-b.open).map(p=>{
      const x=X(p.lng).toFixed(1),y=Y(p.lat).toFixed(1);
      const active=p.open>0, r=active?R_ACTIVE:R_IDLE;
      const badge=active
        ? `<text x="${x}" y="${(+y+4.2).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="${p.open>99?9:p.open>9?11:12.5}" font-weight="800" pointer-events="none">${p.open}</text>`
        : "";
      return `<g class="ow-dot${active?" on":""}" data-sid="${p.sid}" data-name="${escA(storeName(p.sid))}" data-open="${p.open}" data-tech="${escA(p.techName)}"
              onmousemove="owTip(event,this)" onmouseleave="owTipHide()" onclick="owDotClick(this)">
        ${owBubble(x,y,r,p.cols,active)}
        ${badge}
      </g>`;}).join("");
    ZONEMAP_PTS=mapped.map(p=>({sid:p.sid,lat:p.lat,lng:p.lng,open:p.open,cols:p.cols,techName:p.techName}));
    svg=`<svg viewBox="0 0 ${W} ${H}" class="ow-map" preserveAspectRatio="xMidYMid meet">
      <rect x="0" y="0" width="${W}" height="${H}" fill="var(--panel-2)"/>${dots}</svg>`;
  }

  const unmappedBlock=unmapped.length?`
    <div class="ow-unmapped">
      <b>${unmapped.length} store${unmapped.length===1?"":"s"} without GPS coordinates</b> — not on the map:
      ${unmapped.sort((a,b)=>b.open-a.open).map(r=>`<button class="ow-um" onclick="owFocusStore('${r.sid}')">${esc(storeName(r.sid))}${r.open?` <b>${r.open}</b>`:""}</button>`).join("")}
    </div>`:"";

  return `
    <div class="page-head"><div>
      <div class="page-title">Open tickets by zone</div>
      <div class="page-meta">${totalOpen} open across ${ids.length} stores · ${techCount} in-house tech${techCount===1?"":"s"}</div>
    </div></div>
    <div class="ow-map-wrap">
      <div id="owLeaflet" class="ow-leaflet"></div>
      <div class="ow-svgfallback">${svg}</div>
      <div class="ow-tip" id="owTip"></div>
      <div class="ow-legend">${legend}</div>
    </div>
    ${unmappedBlock}`;
}


/* ---- real map tiles ---------------------------------------------------------
   The SVG scatter is kept as a fallback (and is what renders if the tile layer
   can't load), but when Leaflet is available we draw the same bubbles over an
   actual basemap so you get terrain shading, highways and city names for
   context. Tiles are pulled on demand — never on a normal page load. */
let ZONEMAP_PTS=[], ZONEMAP=null;
function ensureLeaflet(){
  if(window.L&&window.L.map)return Promise.resolve(true);
  return new Promise(res=>{
    const css=document.createElement("link");
    css.rel="stylesheet";css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);
    const sc=document.createElement("script");
    sc.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    sc.onload=()=>res(!!(window.L&&window.L.map));
    sc.onerror=()=>res(false);
    document.head.appendChild(sc);
  });
}
/* Bubble as an HTML marker so it matches the SVG look: split colour bands for
   shared stores, count badge, faded dot when nothing is open. */
function zoneMarkerHtml(p){
  const active=p.open>0, size=active?28:12;
  const bands=p.cols.length<=1
    ? `background:${p.cols[0]||NO_TECH_COLOR}`
    : `background:linear-gradient(90deg,${p.cols.map((c,i)=>{
        const a=(i*100/p.cols.length).toFixed(2),b=((i+1)*100/p.cols.length).toFixed(2);
        return `${c} ${a}%,${c} ${b}%`}).join(",")})`;
  return `<div class="zm-pin${active?" on":""}" style="width:${size}px;height:${size}px;${bands};opacity:${active?0.95:0.5}">${
    active?`<span>${p.open}</span>`:""}</div>`;
}
async function initZoneMap(){
  const host=$("owLeaflet");
  if(!host||!ZONEMAP_PTS.length)return;
  if(!await ensureLeaflet())return;           // SVG fallback stays visible
  document.querySelectorAll(".ow-svgfallback").forEach(e=>e.style.display="none");
  host.style.display="block";
  if(ZONEMAP){try{ZONEMAP.remove()}catch(e){}ZONEMAP=null}
  ZONEMAP=L.map(host,{zoomControl:true,attributionControl:true,scrollWheelZoom:false});
  // Voyager: subtle terrain + highway and city labels without the clutter of a
  // full street map at low zoom.
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    {maxZoom:19,subdomains:"abcd",attribution:"© OpenStreetMap © CARTO"}).addTo(ZONEMAP);
  const bounds=[];
  ZONEMAP_PTS.forEach(p=>{
    const size=p.open>0?28:12;
    const m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:"zm-wrap",html:zoneMarkerHtml(p),
      iconSize:[size,size],iconAnchor:[size/2,size/2]}),riseOnHover:true}).addTo(ZONEMAP);
    m.bindTooltip(`${storeName(p.sid)} — ${p.open} open · ${p.techName}`,{direction:"top",offset:[0,-10]});
    m.on("click",()=>owFocusStore(p.sid));
    bounds.push([p.lat,p.lng]);
  });
  if(bounds.length) ZONEMAP.fitBounds(bounds,{padding:[36,36],maxZoom:11});
  setTimeout(()=>{try{ZONEMAP.invalidateSize()}catch(e){}},120);
}

// Tap a store on the map -> its ticket list, filtered to that store.
function owFocusStore(sid){owView="list";curStore=sid;curFilter="active";render();}
/* Hover card. The old SVG <title> was the browser's native tooltip: ~1s delay
   and unstyleable. This one is instant and follows the cursor. */
function owTip(e,g){
  const tip=$("owTip"), wrap=g.closest(".ow-map-wrap");
  if(!tip||!wrap)return;
  const n=+g.getAttribute("data-open");
  tip.innerHTML=`<div class="owt-name">${esc(g.getAttribute("data-name"))}</div>
    <div class="owt-sub"><b>${n}</b> open ticket${n===1?"":"s"} · ${esc(g.getAttribute("data-tech"))}</div>`;
  const r=wrap.getBoundingClientRect();
  let x=e.clientX-r.left+14, y=e.clientY-r.top+14;
  tip.classList.add("on");
  // keep the card inside the map box
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  if(x+tw>r.width-8) x=e.clientX-r.left-tw-14;
  if(y+th>r.height-8) y=e.clientY-r.top-th-14;
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
function owTipHide(){const t=$("owTip");if(t)t.classList.remove("on")}
/* Phones have no hover, so a tap shows the card pinned with an explicit
   button rather than navigating away before it can be read. */
function owDotClick(g){
  const sid=g.getAttribute("data-sid");
  if(!IS_MOBILE){owFocusStore(sid);return}
  const tip=$("owTip"), wrap=g.closest(".ow-map-wrap");
  if(!tip||!wrap){owFocusStore(sid);return}
  const n=+g.getAttribute("data-open");
  const box=g.getBoundingClientRect(), r=wrap.getBoundingClientRect();
  tip.innerHTML=`<div class="owt-name">${esc(g.getAttribute("data-name"))}</div>
    <div class="owt-sub"><b>${n}</b> open ticket${n===1?"":"s"} · ${esc(g.getAttribute("data-tech"))}</div>
    <button class="btn btn-primary btn-sm" style="margin-top:8px;width:100%" onclick="owFocusStore('${sid}')">View tickets</button>`;
  tip.classList.add("on");
  let x=box.left-r.left+box.width/2-tip.offsetWidth/2, y=box.top-r.top+box.height+8;
  x=Math.max(8,Math.min(x,r.width-tip.offsetWidth-8));
  if(y+tip.offsetHeight>r.height-8) y=box.top-r.top-tip.offsetHeight-8;
  tip.style.left=x+"px"; tip.style.top=y+"px";
}




/* ============================================================ VENDOR COVERAGE MAP (overwatch)
   Every third-party vendor with a service area drawn as a dot (their base) plus
   a translucent circle (their radius), over the same tiles as the zone map.
   Stores are small markers so you can see at a glance who is actually reachable.
   In-house techs are deliberately absent — FindMi defines their coverage. */
let VMAP=null;
function openVendorMap(){
  const withArea=Object.entries(VENDORS).filter(([,v])=>vendorArea(v));
  const without=Object.entries(VENDORS).filter(([,v])=>!vendorArea(v));
  modal(`<div class="sheet-head"><h2>Vendor coverage</h2><button class="x-btn" onclick="openVendors()">✕</button></div>
    <div class="sheet-body">
      <div id="vmap" class="vmap"></div>
      <div id="vmapNote" class="rp-empty" style="display:none">Loading map…</div>
      <div class="section-label" style="margin-top:16px">Service areas · ${withArea.length}<span class="ln"></span></div>
      ${withArea.length?withArea.map(([id,v])=>{
        const a=vendorArea(v);
        const n=Object.keys(RESTAURANTS).filter(sid=>vendorCoversStore(v,sid)).length;
        return `<div class="vm-row" onclick="vmapFocus('${id}')">
          <span class="v-dot" style="background:${vendorColor(id)}"></span>
          <div style="flex:1;min-width:0"><div class="v-name">${esc(v.name)}</div>
            <div class="v-meta">${esc(a.place||a.zip)} · ${esc(String(a.radius))} mi · reaches <b>${n}</b> store${n===1?"":"s"}</div></div>
          <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();editVendor('${id}')">Edit</button>
        </div>`;}).join(""):'<div class="rp-empty">No vendor has a service area yet. Add a ZIP and radius when editing a vendor.</div>'}
      ${without.length?`<div class="section-label" style="margin-top:16px">No area set · ${without.length}<span class="ln"></span></div>
        <p style="color:var(--ink-dim);font-size:12.5px;margin:0">${without.map(([,v])=>esc(v.name)).join(" · ")} — offered for every store.</p>`:""}
    </div>
    <div class="sheet-foot"><button class="btn btn-ghost btn-block" onclick="openVendors()">Back to techs &amp; vendors</button></div>`);
  setTimeout(initVendorMap,60);
}
/* Stable colour per vendor so the circle and the list row match. */
function vendorColor(id){
  const ids=Object.keys(VENDORS).sort();
  return ZONE_PALETTE[Math.max(0,ids.indexOf(id))%ZONE_PALETTE.length];
}
async function initVendorMap(){
  const host=$("vmap"); if(!host)return;
  const note=$("vmapNote");
  if(!await ensureLeaflet()){
    host.style.display="none";
    if(note){note.style.display="";note.textContent="Map couldn't load — the service-area list below still works.";}
    return;
  }
  if(note)note.style.display="none";
  if(VMAP){try{VMAP.remove()}catch(e){}VMAP=null}
  VMAP=L.map(host,{zoomControl:true,scrollWheelZoom:false});
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    {maxZoom:19,subdomains:"abcd",attribution:"© OpenStreetMap © CARTO"}).addTo(VMAP);
  const bounds=[];
  // stores first, so vendor circles sit above them
  Object.keys(RESTAURANTS).forEach(sid=>{
    const c=storeCoords(sid); if(!c)return;
    L.circleMarker([c.lat,c.lng],{radius:3.5,color:"#334155",weight:1,fillColor:"#64748b",fillOpacity:.9})
      .addTo(VMAP).bindTooltip(storeName(sid),{direction:"top"});
    bounds.push([c.lat,c.lng]);
  });
  VMAP._vendorLayers={};
  Object.entries(VENDORS).forEach(([id,v])=>{
    const a=vendorArea(v); if(!a)return;
    const col=vendorColor(id);
    const g=L.layerGroup().addTo(VMAP);
    L.circle([a.lat,a.lng],{radius:a.radius*1609.34,color:col,weight:2,fillColor:col,fillOpacity:.12}).addTo(g);
    L.circleMarker([a.lat,a.lng],{radius:7,color:"#fff",weight:2,fillColor:col,fillOpacity:1})
      .addTo(g).bindTooltip(`${v.name} — ${a.radius} mi`,{direction:"top"});
    VMAP._vendorLayers[id]={g,a};
    bounds.push([a.lat,a.lng]);
  });
  if(bounds.length)VMAP.fitBounds(bounds,{padding:[30,30],maxZoom:10});
  setTimeout(()=>{try{VMAP.invalidateSize()}catch(e){}},120);
}
function vmapFocus(id){
  const rec=VMAP&&VMAP._vendorLayers&&VMAP._vendorLayers[id];
  if(!rec)return;
  VMAP.fitBounds(L.circle([rec.a.lat,rec.a.lng],{radius:rec.a.radius*1609.34}).getBounds(),{padding:[24,24]});
}

/* ============================================================ CATEGORY EDITOR (overwatch)
   Per-division category + subcategory editing. Saves to admins/divisionCategories
   so DPM FindMi reads the same tree. */
let CE_DIV="bk", CE_TREE=null, CE_OPEN={};
function openCatEditor(div){

function renderCatEditor(){

    </div>`;}).join("");
  modal(`<div class="sheet-head"><h2>Categories</h2><button class="x-btn" onclick="openSettings()">✕</button></div>
    <div class="sheet-body">
      <div class="ce-tabs">${tabs}</div>
      <p style="color:var(--ink-dim);font-size:12.5px;margin:12px 0 10px">
        <b>${esc(divisionLabel(CE_DIV))}</b> · ${CE_TREE.length} categor${CE_TREE.length===1?"y":"ies"} · ${nSub} subcategor${nSub===1?"y":"ies"}.
        A category with no subcategories stays single-level.</p>
      ${rows||'<div class="rp-empty">No categories yet for this division.</div>'}
      <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="ceAddCat()">＋ Add category</button>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" style="flex:1" onclick="openSettings()">Cancel</button>
      <button class="btn btn-primary" style="flex:1" id="ceSave" onclick="saveCatEditor()">Save ${esc(divisionLabel(CE_DIV))}</button>
    </div>`);
}
function ceAddCat(){CE_TREE.push({key:"",label:"",subs:[]});renderCatEditor()}
function ceAddSub(ci){CE_TREE[ci].subs=CE_TREE[ci].subs||[];CE_TREE[ci].subs.push({key:"",label:""});CE_OPEN[CE_TREE[ci].key]=true;renderCatEditor()}
async function saveCatEditor(){
  // Keys are generated from labels but NEVER regenerated for existing entries,
  // so renaming a category can't orphan the tickets already filed under it.
  const seen=new Set();
  const tree=CE_TREE.map(c=>{
    const label=(c.label||"").trim(); if(!label)return null;
    let key=c.key||catKeyFrom(label);
    while(seen.has(key))key+="_2"; seen.add(key);
    const subs=(c.subs||[]).map(sb=>{
      const sl=(sb.label||"").trim(); if(!sl)return null;
      let sk=sb.key||(key+"_"+catKeyFrom(sl));
      while(seen.has(sk))sk+="_2"; seen.add(sk);
      return {key:sk,label:sl};
    }).filter(Boolean);
    return {key,label,subs};
  }).filter(Boolean);
  if(!tree.length){toast("Add at least one category","err");return}
  const btn=$("ceSave");if(btn){btn.disabled=true;btn.innerHTML='<span class="inline-spin"></span>'}
  const all={...DIVISION_CATEGORIES,[CE_DIV]:tree};
  try{
    await apiWrite("admins/divisionCategories",all);
    MASTER.admins=MASTER.admins||{};MASTER.admins.divisionCategories=all;
    loadCategories();
    toast(divisionLabel(CE_DIV)+" categories saved");
    refreshInBackground();openSettings();
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent="Save";}
    toast(e.message||"Could not save categories","err");
  }
}

/* ============================================================ OWLOPS IMPORT (overwatch)
   Two-phase by design: parse + preview first, write only on approval.
   Everything is mapped to FixMi's own shape — original dates, original
   reporter and the OwlOps comment thread are all preserved so imported
   tickets read like native ones. */
let IMP={rows:[],catMap:{},loaded:false};

function openImport(){
  IMP={rows:[],catMap:{},loaded:false};
  modal(`<div class="sheet-head"><h2>Import from OwlOps</h2><button class="x-btn" onclick="closeModal()">✕</button></div>
    <div class="sheet-body">
      <div class="upload-zone" onclick="$('impFile').click()">
        <div class="uz-ic">📥</div><div class="uz-t">Choose the OwlOps export</div>
        <div class="uz-h mono">.xlsx or .csv — nothing is imported until you approve the preview</div>
      </div>
      <input type="file" id="impFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleImportFile(this)">
      <div id="impOut" style="margin-top:16px"></div>
    </div>`);
}

/* SheetJS is only needed for .xlsx; pull it on demand so it never slows a normal load. */
function ensureXLSX(){
  if(window.XLSX)return Promise.resolve(true);
  return new Promise(res=>{
    const sc=document.createElement("script");
    sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload=()=>res(!!window.XLSX); sc.onerror=()=>res(false);
    document.head.appendChild(sc);
  });
}
function parseCSV(text){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"')q=true;
    else if(c===","){row.push(cur);cur="";}
    else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur="";}
    else if(c!=="\r")cur+=c;
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}

async function handleImportFile(input){
  const f=input.files&&input.files[0]; input.value="";
  if(!f)return;
  const out=$("impOut"); out.innerHTML=`<div class="rp-empty"><span class="inline-spin"></span> Reading ${esc(f.name)}…</div>`;
  try{
    let grid;
    if(/\.csv$/i.test(f.name)) grid=parseCSV(await f.text());
    else{
      if(!await ensureXLSX()){out.innerHTML=`<div class="imp-err">Couldn't load the spreadsheet reader. Re-save the file as .csv and try again.</div>`;return}
      const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true});
      grid=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""});
    }
    buildImportPreview(grid);
    startImportReview();   // straight into one-at-a-time review, no list wall
  }catch(e){ out.innerHTML=`<div class="imp-err">Could not read that file: ${esc(e.message||"unknown error")}</div>`; }
}

/* ---- field helpers ---------------------------------------------------- */
const OWL_PRI={high:"emergency",urgent:"emergency",med:"urgent",medium:"urgent",low:"normal","non-urgent":"normal",nonurgent:"normal"};
function impDigits(v){return String(v||"").replace(/\D/g,"").replace(/^0+/,"")}
function impDate(v){
  if(!v)return null;
  if(v instanceof Date&&!isNaN(v))return v.getTime();
  const t=Date.parse(String(v));
  return isNaN(t)?null:t;
}
/* "BK25385 Athens (IT - Terminals)" -> {category:"IT", asset:"Terminals"} */
function impAsset(v){
  const m=String(v||"").match(/\(([^()]*)\)\s*$/);
  if(!m)return {category:"",asset:""};
  const inner=m[1].trim();
  const i=inner.indexOf(" - ");
  return i<0?{category:inner,asset:""}:{category:inner.slice(0,i).trim(),asset:inner.slice(i+3).trim()};
}
/* Store number may sit anywhere in the label and carry leading zeros. */
/* The export's category column is wrong for POS items (Terminals, Kitchen
   Screen and friends are all filed under "IT"). The ASSET name is unambiguous,
   so resolve against the live BK tree by asset and fall back to the stated
   category only when the asset can't be placed. */
function impResolveCat(owlCat,asset,sid){
  const tree=sid?catsForStore(sid):catsForDivision("bk");
  const norm=x=>String(x||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  const a=norm(asset);
  if(a){
    for(const c of tree) for(const sb of (c.subs||[]))
      if(norm(sb.label)===a) return {cat:c.key,sub:sb.key,how:"asset"};
    for(const c of tree) for(const sb of (c.subs||[]))
      if(norm(sb.label).includes(a)||a.includes(norm(sb.label))) return {cat:c.key,sub:sb.key,how:"asset~"};
  }
  const oc=norm(owlCat);
  const hit=tree.find(c=>norm(c.label)===oc)||tree.find(c=>oc&&norm(c.label).includes(oc));
  return hit?{cat:hit.key,sub:"",how:"category"}:{cat:"",sub:"",how:""};
}
/* Resolve an OwlOps assignee name against the live directory. Checks in-house
   techs first, then vendors. Tolerant of case, punctuation, nicknames in quotes
   and middle names; falls back to a first+last match so "Ray Wickware" still
   finds "Ravay 'Ray' Wickware". Returns null when there is no confident match —
   never guesses. */
function impNorm(x){return String(x||"").toLowerCase().replace(/['"()]/g,"").replace(/[^a-z0-9]+/g," ").trim()}
function impMatchPerson(name){
  const n=impNorm(name);
  if(!n||n.length<3)return null;
  // a store name in the Assign column is not a person
  if(/^bk\s*\d/.test(n))return null;
  const techs=Object.entries(MASTER.repairTechnicians||{}).map(([id,t])=>({kind:"tech",id,name:t.name||""}));
  const vends=Object.entries(VENDORS).map(([id,v])=>({kind:"vendor",id,name:v.name||""}));
  const all=[...techs,...vends];
  let hit=all.find(p=>impNorm(p.name)===n);
  if(hit)return hit;
  const parts=n.split(" ").filter(Boolean);
  const first=parts[0], last=parts[parts.length-1];
  if(parts.length>=2){
    hit=all.find(p=>{const q=impNorm(p.name).split(" ").filter(Boolean);
      return q.length>=2 && q[0]===first && q[q.length-1]===last;});
    if(hit)return hit;
    // nickname case: last name matches and the first name appears anywhere
    hit=all.find(p=>{const q=impNorm(p.name).split(" ").filter(Boolean);
      return q[q.length-1]===last && q.includes(first);});
    if(hit)return hit;
  }
  return null;
}
function impMatchStore(dept){
  const num=impDigits((String(dept||"").match(/BK\s*0*(\d{3,6})/i)||[])[1]||"");
  if(num){
    const hit=Object.keys(RESTAURANTS).find(rid=>impDigits(store(rid).storeNumber)===num);
    if(hit)return {sid:hit,how:"number"};
  }
  const clean=String(dept||"").replace(/BK\s*\d+/ig,"").replace(/[^a-z ]/ig," ").trim().toLowerCase();
  if(clean.length>3){
    const hit=Object.keys(RESTAURANTS).find(rid=>storeName(rid).toLowerCase().includes(clean));
    if(hit)return {sid:hit,how:"name"};
  }
  return {sid:null,how:null};
}
/* Rough similarity for the near-duplicate check. */
function impSim(a,b){
  const tok=x=>new Set(String(x||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>3));
  const A=tok(a),B=tok(b); if(!A.size||!B.size)return 0;
  let n=0; A.forEach(w=>{if(B.has(w))n++});
  return n/Math.min(A.size,B.size);
}

function buildImportPreview(grid){
  const out=$("impOut");
  if(!grid||grid.length<2){out.innerHTML=`<div class="imp-err">That file has no data rows.</div>`;return}
  const hdr=grid[0].map(h=>String(h||"").trim());
  const col=n=>hdr.findIndex(h=>h.toLowerCase()===n.toLowerCase());
  const need=["Task #","Department","Asset/List","Description","Created","Priority"];
  const missing=need.filter(n=>col(n)<0);
  if(missing.length){out.innerHTML=`<div class="imp-err">This doesn't look like an OwlOps export — missing column(s): <b>${esc(missing.join(", "))}</b></div>`;return}

  const G=(r,n)=>{const i=col(n);return i<0?"":r[i]};
  const existing=Object.values(TICKETS);
  IMP.rows=[];
  for(let i=1;i<grid.length;i++){
    const r=grid[i]; if(!String(G(r,"Task #")||"").trim())continue;
    const {category,asset}=impAsset(G(r,"Asset/List"));
    const m=impMatchStore(G(r,"Department"));
    const desc=String(G(r,"Description")||"").trim();
    const closeDate=impDate(G(r,"Close Date"));
    const ref=String(G(r,"Task #")).trim();
    // duplicate detection: same external ref, or same store + very similar text
    let dup=existing.find(t=>t.externalRef&&String(t.externalRef)===ref);
    if(!dup&&m.sid) dup=existing.find(t=>t.storeId===m.sid&&impSim(t.description,desc)>=0.6);
    // Also compare against EARLIER ROWS IN THIS FILE. Multi-year OwlOps exports
    // often carry several similar tickets for one store (e.g. tile repairs in
    // four different areas), so flag rather than auto-skip: these are usually
    // legitimately distinct and only you can tell.
    let sibling=null;
    if(!dup&&m.sid){
      const near=IMP.rows.find(x=>x.sid===m.sid&&impSim(x.desc,desc)>=0.6);
      if(near)sibling="#"+near.ref;
    }
    const res=impResolveCat(category,asset,m.sid);
    const who=impMatchPerson(String(G(r,"Assign")||""));
    IMP.rows.push({
      ref, dept:String(G(r,"Department")||""), sid:m.sid, matchHow:m.how,
      assignRaw:String(G(r,"Assign")||"").trim(),
      // Everything else OwlOps gives us, kept verbatim so nothing is lost.
      owlRegion:String(G(r,"Region")||"").trim(),
      owlSubregion:String(G(r,"Subregion")||"").trim(),
      owlVendor:String(G(r,"Vendor")||"").replace(/^n\/a$/i,"").trim(),
      owlTime:String(G(r,"Time Logged")||"").replace(/^0h 0m$/,"").trim(),
      owlCost:String(G(r,"Cost Logged")||"").replace(/^0$/,"").trim(),
      owlParts:String(G(r,"Parts")||"").replace(/^0$/,"").trim(),
      owlCloseDays:String(G(r,"Close Days")||"").replace(/^0$/,"").trim(),
      owlAssetRaw:String(G(r,"Asset/List")||"").trim(),
      owlCat:category, asset, cat:res.cat, sub:res.sub, catHow:res.how, desc,
      pri:OWL_PRI[String(G(r,"Priority")||"").trim().toLowerCase()]||"normal",
      createdAt:impDate(G(r,"Created"))||now(),
      updatedAt:impDate(G(r,"Last Updated"))||null,
      createdByName:String(G(r,"Created By")||"").trim(),
      lastNote:(function(v){v=String(v||"").trim();return /^created$/i.test(v)?"":v})(G(r,"Last Update")),
      lastBy:String(G(r,"Last Updated By")||"").trim(),
      closedAt:closeDate, closeNotes:String(G(r,"Close Notes")||"").trim(),
      closedBy:String(G(r,"Closed By")||"").replace(/^n\/a$/i,"").trim(),
      assignKind:who?who.kind:"", assignId:who?who.id:"", assignName:who?who.name:"",
      dupOf:dup?(dup.shortId||"existing ticket"):null,
      sibling,                       // similar row earlier in this same file
      skip:!!dup                     // only true duplicates are pre-unticked
    });
  }
  // seed category mapping: exact/loose match against the live category list
  const owlCats=[...new Set(IMP.rows.map(r=>r.owlCat).filter(Boolean))];
  owlCats.forEach(c=>{
    if(IMP.catMap[c])return;
    const lc=c.toLowerCase();
    const hit=Object.keys(CATEGORIES).find(k=>CATEGORIES[k].toLowerCase()===lc)
           || Object.keys(CATEGORIES).find(k=>lc.includes(CATEGORIES[k].toLowerCase()));
    IMP.catMap[c]=hit||"";
  });
  IMP.loaded=true;
  renderImportPreview();
}

function renderImportPreview(){
  const out=$("impOut"); if(!out)return;
  const rows=IMP.rows;
  const ov=$("modalOverlay"); if(ov)ov.classList.add("wide");
  const unmatched=rows.filter(r=>!r.sid).length;
  const dups=rows.filter(r=>r.dupOf||r.sibling).length;
  const queued=rows.filter(r=>impReady(r)).length;

  const catRows=Object.keys(IMP.catMap).sort().map(c=>{
    const opts=categoryGroupsByDivision().map(g=>
      `<optgroup label="${escA(g.label)}">`+g.cats.map(c=>
        `<option value="${c.key}"${IMP.catMap[c]===c.key?" selected":""}>${esc(c.label)}</option>`).join("")+`</optgroup>`).join("");
    return `<div class="imp-map">
      <span class="imp-owl">${esc(c)}</span><span class="imp-arrow">→</span>
      <select class="input" onchange="IMP.catMap['${escA(c)}']=this.value;renderImportPreview()">
        <option value="">— choose a category —</option>${opts}
      </select></div>`;}).join("");

  const cards=rows.map((r,i)=>impCard(r,i)).join("");

  out.innerHTML=`
    <div class="imp-summary">
      <div class="rp-stat"><div class="rp-n">${rows.length}</div><div class="rp-l">in file</div></div>
      <div class="rp-stat"><div class="rp-n">${queued}</div><div class="rp-l">queued</div></div>
      <div class="rp-stat"><div class="rp-n">${unmatched}</div><div class="rp-l">no store</div></div>
      <div class="rp-stat"><div class="rp-n">${dups}</div><div class="rp-l">possible dupes</div></div>
    </div>
    ${Object.values(IMP.catMap).some(v=>!v)?`<div class="imp-warnbox">Some OwlOps categories still need mapping — those rows use their own resolved category where possible.</div>`:""}
    ${catRows?`<div class="section-label" style="margin-top:16px">Category mapping<span class="ln"></span></div>${catRows}`:""}
    <div class="section-label" style="margin-top:18px">Queue · ${queued} of ${rows.length}<span class="ln"></span></div>
    <p style="color:var(--ink-dim);font-size:12.5px;margin:0 0 10px">Nothing is written yet. Review one at a time — each ticket is saved only when you approve it.</p>
    <div class="imp-list">${cards}</div>
    <button class="btn btn-primary btn-block" style="margin-top:14px" ${queued?"":"disabled"} onclick="startImportReview()">
      Review &amp; import ${queued} ticket(s) →</button>`;
}
function impReady(r){return !!(r.sid && !r.skip && (r.cat||IMP.catMap[r.owlCat]) && !r.done)}
function impCard(r,i){
  const cat=r.cat||IMP.catMap[r.owlCat];
  const problem = r.done ? `<span class="imp-ok">imported ${esc(r.done)}</span>`
                : !r.sid ? `<span class="imp-bad">store not found</span>`
                : !cat  ? `<span class="imp-bad">needs a category</span>`
                : r.dupOf ? `<span class="imp-warn">looks like ${esc(r.dupOf)}</span>`
                : r.sibling ? `<span class="imp-warn">similar to ${esc(r.sibling)} in this file</span>` : "";
  return `<div class="imp-card${(r.skip||r.done)?" off":""}">
    <label class="imp-chk"><input type="checkbox" ${(r.skip||r.done)?"":"checked"} ${r.done?"disabled":""} onchange="IMP.rows[${i}].skip=!this.checked;renderImportPreview()"></label>
    <div class="imp-body">
      <div class="imp-top">
        <b>${r.sid?esc(storeName(r.sid)):esc(r.dept)}</b>

/* ---- one-at-a-time review -------------------------------------------------
   Deliberately NOT a bulk write. Each ticket is shown fully editable; it is
   only written when you approve it, then the next one loads. You can stop at
   any point and everything already approved stays saved. */
let IMP_Q=[], IMP_I=0, IMP_DONE=0, IMP_FAIL=0;
function startImportReview(){
  IMP_Q=IMP.rows.map((r,i)=>i).filter(i=>impReady(IMP.rows[i]));
  IMP_I=0; IMP_DONE=0; IMP_FAIL=0;
  if(!IMP_Q.length){toast("Nothing queued","err");return}
  renderImportStep();
}
function renderImportStep(){

  out.innerHTML=`
    <div class="imp-step-head">
      <div><b>Ticket ${IMP_I+1} of ${IMP_Q.length}</b> <span class="mono" style="color:var(--ink-dim)">OwlOps #${esc(r.ref)}</span></div>
      <div class="bp-track" style="margin-top:8px"><div class="bp-fill" style="width:${Math.round(IMP_I/IMP_Q.length*100)}%"></div></div>

    ${r.sibling?`<div class="imp-warnbox">Similar to ${esc(r.sibling)} earlier in this file — check it isn't the same issue.</div>`:""}
    <div class="imp-fields"><div class="field full"><label class="label">Store</label>
      <select class="input" id="isStore" onchange="impStepStoreChanged()">
        ${stores.map(id=>`<option value="${id}"${id===r.sid?" selected":""}>${esc(storeName(id))}</option>`).join("")}
      </select>
      <div class="uz-h mono" style="margin-top:4px;color:var(--ink-dim)">OwlOps said: ${esc(r.dept)}</div></div>
      <div class="field"><label class="label">Category</label>
        <select class="input" id="isCat" onchange="impStepCatChanged()">${catOpts}</select></div>
      <div class="field"><label class="label">Priority</label>
        <select class="input" id="isPri">${priOpts}</select></div>
    <div class="field full" id="isSubWrap" style="${subs.length?"":"display:none"}">
      <label class="label">Subcategory</label><select class="input" id="isSub">${subOpts}</select>
      ${r.asset?`<div class="uz-h mono" style="margin-top:4px;color:var(--ink-dim)">OwlOps asset: ${esc(r.asset)}</div>`:""}</div>
    <div class="field full"><label class="label">Assign to
      ${r.assignName?`<span style="font-weight:400;color:var(--green,#16a34a)">· matched from "${esc(r.assignRaw)}"</span>`
        :(r.assignRaw?`<span style="font-weight:400;color:var(--ink-dim)">· OwlOps said "${esc(r.assignRaw)}" — no match in your directory</span>`:"")}</label>
      <select class="input" id="isWho">${impAssignOpts(r)}</select>
